<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>奶蛙跑酷 · 作者：汤圆Vision</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#241d2e;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;box-shadow:0 0 70px rgba(0,0,0,.5);border-radius:2px}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
"use strict";
/* ==========================================================================
 * 奶蛙跑酷 —— 纯 HTML5 Canvas + JavaScript 竖版跑酷（单文件 / 零依赖 / 双击即玩）
 * 作者：汤圆Vision
 *
 * 故事：奶蛙（爸爸）下班回家瘫在沙发上玩手机，孩子哭了没听见、奶瓶也没洗，
 *       豆姐（妈妈）当场暴走，于是全家总动员的追逐战开始了……
 *
 * 玩法：三条轨道自动前进。左右换道躲障碍，跳跃跨过矮障碍，滑铲钻过晾衣绳。
 *       豆姐每隔几秒往某一条轨道扔东西——换道或滑铲能躲开；
 *       她扔出来的「小孩」如果跳起来接住，可以拿到额外奖励分。
 *       失误越多，豆姐追得越近、扔得越勤。
 *
 * 操作：键盘 ← → / A D 换道；↑ / W / 空格 跳；↓ / S 滑铲；R 重开
 *       触屏：左右滑换道，上滑跳，下滑滑铲，点按开始 / 重开
 *
 * 代码结构：
 *   0 通用工具      1 画布自适应     2 配置常量     3 输入系统    4 音效
 *   5 角色绘制（奶蛙 / 豆姐 / 小孩 / 牛来 / 肥嘟嘟）
 *   6 障碍物与道具绘制   7 背景与跑道   8 游戏逻辑   9 渲染   10 界面与主循环
 * ========================================================================== */

/* ============================== 0. 通用工具 ============================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const rnd   = (a, b) => a + Math.random() * (b - a);
const rndI  = (a, b) => Math.floor(rnd(a, b + 1));
const pick  = a => a[(Math.random() * a.length) | 0];
const chance = p => Math.random() < p;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn  = t => t * t * t;
// 角度抖动（用于卡通式的"颤动"描边）
const wob = (t, amp) => Math.sin(t * 13.7) * amp;

/* ============================ 1. 画布与自适应 ============================ */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1;      // 逻辑尺寸 / 设备像素比

function resize() {
  const maxW = window.innerWidth, maxH = window.innerHeight;
  // 竖版：手机上铺满，宽屏桌面上裁成 9:16 左右的竖条并居中
  const cssH = maxH;
  const cssW = Math.min(maxW, Math.round(maxH * 0.60));
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width  = cssW + 'px';
  cv.style.height = cssH + 'px';
  cv.width  = Math.round(cssW * DPR);
  cv.height = Math.round(cssH * DPR);
  W = cssW; H = cssH;
  buildGradients();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ============================== 2. 配置常量 ============================== */
const CFG = {
  // —— 透视（伪 3D）——
  Z0: 400,            // 透视常数：决定远端路宽收敛到约 0.12W
  Z_FAR: 1750,        // 生成距离（远处由小变大接近，不会突然冒出）
  Z_DEAD: -190,       // 移除距离（已经飞过镜头）
  HORIZON: 0.35,      // 消失点高度 vanishY = H * 0.35（屏幕中上方）
  BASE_Y:  0.78,      // 玩家所在深度平面的屏幕高度
  LANE_DX: 0.1875,    // 相邻轨道间距：使屏幕底边路宽恰为 0.85W
  // —— 角色基准尺寸（占屏高比例，约 1/6 屏高）——
  P_SIZE: 0.165,      // 奶蛙身高
  D_SIZE: 0.190,      // 豆姐身高（成人在同等深度下略高一点）
  // —— 运动 ——
  V_START: 320, V_MAX: 980, V_ACCEL: 8.5,
  GRAV: 14.5, JUMP_V: 5.0,          // 跳跃（单位：身位/秒）
  SLIDE_T: 0.55, LANE_T: 0.10,      // 滑铲时长 / 换道插值时间
  // —— 玩法 ——
  THROW_MIN: 2.8, THROW_MAX: 8.5,   // 豆姐投掷间隔（起步宽松，随怒气缩短）
  PAN_RATE: 0.05, BABY_RATE: 0.10,  // 平底锅 5% / 小孩 10%
  INV_T: 5.0, DASH_T: 5.0,          // 无敌 / 冲刺时长
};

// 深度 z -> 投影：scale / 屏幕坐标
/* 深度 z（世界单位，0=玩家平面）→ 透视缩放 scale。1=玩家大小，→0 收敛到消失点 */
function pScale(z) { return CFG.Z0 / (CFG.Z0 + z); }
function pY(sc) { return H * CFG.HORIZON + (H * CFG.BASE_Y - H * CFG.HORIZON) * sc; }
function pX(laneF, sc) { return W * 0.5 + (laneF - 1) * W * CFG.LANE_DX * sc; }
/* 该深度下的路面半宽：与 pY 同样正比于 scale ⇒ 跑道边线必然是过消失点的直线 */
function roadHalf(sc) { return W * CFG.LANE_DX * 1.5 * sc; }
/* 屏幕底边对应的 scale */
function scaleAtBottom() { return (1 - CFG.HORIZON) / (CFG.BASE_Y - CFG.HORIZON); }

/* ============================== 3. 输入系统 ============================== */
// 统一抽象成 4 个动作：left / right / jump / slide，外加 tap（确认）
const IN = { queue: [], tap: false };
function act(a) { IN.queue.push(a); }

const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
  ArrowDown: 'slide', KeyS: 'slide',
};
window.addEventListener('keydown', e => {
  if (e.repeat && !KEYMAP[e.code]) return;
  if (KEYMAP[e.code]) { act(KEYMAP[e.code]); e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter') { IN.tap = true; e.preventDefault(); }
  if (e.code === 'KeyR') { IN.queue.push('restart'); }
  Audio.unlock();
}, { passive: false });

// 触屏：滑动方向判定 + 点按
let tx = 0, ty = 0, tDown = false, tMoved = false;
cv.addEventListener('touchstart', e => {
  const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
  tDown = true; tMoved = false; Audio.unlock(); e.preventDefault();
}, { passive: false });
cv.addEventListener('touchmove', e => {
  if (!tDown) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  const TH = 26;                                  // 滑动判定阈值（px）
  if (!tMoved && Math.max(Math.abs(dx), Math.abs(dy)) > TH) {
    tMoved = true;
    if (Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? 'right' : 'left');
    else act(dy > 0 ? 'slide' : 'jump');
  }
  e.preventDefault();
}, { passive: false });
cv.addEventListener('touchend', e => {
  if (tDown && !tMoved) IN.tap = true;            // 没滑动 = 点按
  tDown = false; e.preventDefault();
}, { passive: false });
// 桌面端也支持鼠标点击确认
cv.addEventListener('mousedown', () => { IN.tap = true; Audio.unlock(); });

/* ================================ 4. 音效 ================================ */
// 用 WebAudio 现场合成，不加载任何音频文件
const Audio = {
  ac: null, on: true, clip: null,          // clip：之后接入外部笑声素材时填 AudioBuffer
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.on = false; }
  },
  tone(f0, f1, dur, type, vol) {
    if (!this.on || !this.ac) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol == null ? 0.10 : vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol) {
    if (!this.on || !this.ac) return;
    const ac = this.ac, n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = buf; g.gain.value = vol || 0.12; s.connect(g); g.connect(ac.destination); s.start();
  },
  jump()   { this.tone(420, 760, 0.16, 'square', 0.07); },
  land()   { this.tone(180, 110, 0.09, 'triangle', 0.06); },
  slide()  { this.noise(0.18, 0.06); },
  swap()   { this.tone(620, 880, 0.07, 'sine', 0.05); },
  hit()    { this.tone(240, 70, 0.26, 'sawtooth', 0.11); this.noise(0.16, 0.09); },
  pick()   { this.tone(880, 1320, 0.11, 'sine', 0.08); this.tone(1320, 1760, 0.10, 'sine', 0.05); },
  grab()   { for (let i = 0; i < 3; i++) setTimeout(() => this.tone(660 + i * 220, 0, 0.09, 'triangle', 0.07), i * 60); },
  /* 奶蛙的嘲笑：四声"哈"，音高逐声下行 + 带通共振峰，听感像卡通坏笑。
   * 如果之后拿到干净的笑声素材，把 LAUGH_CLIP（base64 音频）填上就会优先播真音源。 */
  laugh() {
    if (this.clip) { const src = this.ac.createBufferSource(); src.buffer = this.clip; src.connect(this.ac.destination); src.start(); return; }
    if (!this.on || !this.ac) return;
    const ac = this.ac, t0 = ac.currentTime;
    for (let i = 0; i < 4; i++) {
      const t = t0 + i * 0.15, f0 = 330 - i * 28;
      const o = ac.createOscillator(), g = ac.createGain(), bp = ac.createBiquadFilter(), lpf = ac.createBiquadFilter();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * 1.28, t);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.78, t + 0.13);
      bp.type = 'bandpass'; bp.frequency.value = 820 + i * 90; bp.Q.value = 0.9;
      lpf.type = 'lowpass'; lpf.frequency.value = 2800;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.018);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(bp); bp.connect(lpf); lpf.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.16);
    }
  },
  smash()  { this.noise(0.22, 0.13); this.tone(160, 60, 0.2, 'square', 0.08); },
  throwS() { this.tone(300, 620, 0.12, 'sine', 0.05); },
  over()   { [520, 420, 320, 200].forEach((f, i) => setTimeout(() => this.tone(f, f * 0.7, 0.2, 'square', 0.09), i * 130)); },
  start()  { [440, 560, 700, 880].forEach((f, i) => setTimeout(() => this.tone(f, 0, 0.1, 'triangle', 0.07), i * 80)); },
};
/* ========================= 5. 基础绘图工具 & 角色 ========================= */
/* ---- 调色板：温暖明亮的奶系配色 ---- */
const C = {
  naiwa: '#FFD93D', naiwaEdge: '#E9B32E', belly: '#F5E6C8', limb: '#6B5B4E', limbD: '#54473C',
  eyeRing: '#BEE3A6', pupil: '#241C18',
  skin: '#FFDBAC', skinSh: '#F2C3AE', hair: '#5D4037', hairL: '#7A5236',
  shirt: '#1F1F24', shirtL: '#34343C', pants: '#2C3038', pantsL: '#3E434E', shoe: '#141417',
  baby: '#FFD93D', babyBelly: '#F7E8CB', diaper: '#FFFFFF', diaperSh: '#E4E6EC',
  cow: '#FFCC33', cowD: '#E5A91A', cowPink: '#FFB6C1', cowPinkD: '#E08FA0', horn: '#888888', hornD: '#6A6A6A',
  roo: '#FFCC33', rooD: '#E5A91A', rooBelly: '#FFF3CD', rooNose: '#8B4513',
  white: '#FFFFFF', ink: '#4A3A30',
  /* 3D 柔体着色：全程不用描边，靠渐变做体积 */
  nTop: '#FFF3AE', nMid: '#FFDC48', nBot: '#F8C64C', nDeep: '#EDAE45',
  bellyHi: '#F7EBD8', bellyLo: '#E4CFB0',
  limbTop: '#D9A93E', limbMid: '#8C7A5F', limbLo: '#665749', limbDeep: '#544739',
  iris: '#54B96A', irisLo: '#2F8A48',
  skinHi: '#FFEEE4', skinMid: '#FBD9C6', skinLo: '#EEBB9E',
  hairHi: '#7A5232', hairMid: '#57351F', hairLo: '#3B2214',
  clothHi: '#33333C', clothMid: '#1C1C22', clothLo: '#0D0D11',
  pantHi: '#3A404C', pantMid: '#262B35', pantLo: '#171B22',
};

/* ---- 形状助手（全部基于圆 / 椭圆 / 矩形 / 贝塞尔，不用任何图片） ---- */
function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); }
function fE(x, y, rx, ry, c, rot) { ell(x, y, rx, ry, rot); ctx.fillStyle = c; ctx.fill(); }
function sE(x, y, rx, ry, c, lw, rot) { ell(x, y, rx, ry, rot); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.stroke(); }
function rrPath(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function fRR(x, y, w, h, r, c) { rrPath(x, y, w, h, r); ctx.fillStyle = c; ctx.fill(); }
function cap(x1, y1, x2, y2, wd, c) { ctx.strokeStyle = c; ctx.lineWidth = wd; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function line(pts, c, lw, close) {
  ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
  ctx.stroke();
}
function fPoly(pts, c) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); }
function star(cx, cy, r1, r2, n, rot, c) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = (rot || 0) + i * Math.PI / n, r = i % 2 ? r2 : r1;
    ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fillStyle = c; ctx.fill();
}
function arc(x, y, r, a0, a1, c, lw) { ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke(); }
function qcurve(x0, y0, cx, cy, x1, y1, c, lw) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke(); }
// 毛茸茸边缘：沿轮廓撒一圈小圆
function fluff(pts, r, c) { ctx.fillStyle = c; for (const p of pts) { fE(p[0], p[1], r, r, c); } }
function fluffArc(cx, cy, rx, ry, a0, a1, n, r, c) {
  ctx.fillStyle = c;
  for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); fE(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, r, r, c); }
}

/* 竖向体积渐变椭圆：顶部受光、底部偏橙 */
function vE(x, y, rx, ry, c0, c1, c2, rot) {
  const g = ctx.createLinearGradient(x, y - ry, x, y + ry);
  g.addColorStop(0, c0); g.addColorStop(0.48, c1); g.addColorStop(1, c2);
  ell(x, y, rx, ry, rot); ctx.fillStyle = g; ctx.fill();
}
/* 球体渐变椭圆：高光偏左上、边缘收暗（无描边） */
function sE2(x, y, rx, ry, c0, c1, c2, rot) {
  const g = ctx.createRadialGradient(x - rx * 0.3, y - ry * 0.42, Math.min(rx, ry) * 0.08, x, y, Math.max(rx, ry) * 1.18);
  g.addColorStop(0, c0); g.addColorStop(0.45, c1); g.addColorStop(1, c2);
  ell(x, y, rx, ry, rot); ctx.fillStyle = g; ctx.fill();
}
/* 羽化椭圆：中心实、边缘完全透明，用于肚皮斑块 */
function feather(x, y, rx, ry, c0, c1, rot) {
  const g = ctx.createRadialGradient(x, y, Math.min(rx, ry) * 0.12, x, y, Math.max(rx, ry));
  g.addColorStop(0, c0); g.addColorStop(0.6, c1); g.addColorStop(1, 'rgba(240,225,200,0)');
  ell(x, y, rx, ry, rot); ctx.fillStyle = g; ctx.fill();
}
/* 锥形四肢：由粗到细，带侧向明暗 */
function limb(x0, y0, w0, x1, y1, w1, c0, c1, e0, e1) {
  const a = Math.atan2(y1 - y0, x1 - x0) + Math.PI / 2, dx = Math.cos(a), dy = Math.sin(a);
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, ww = (w0 + w1) * 0.5;
  ctx.beginPath();
  ctx.moveTo(x0 - dx * w0, y0 - dy * w0);
  ctx.quadraticCurveTo(mx - dx * ww, my - dy * ww, x1 - dx * w1, y1 - dy * w1);
  ctx.lineTo(x1 + dx * w1, y1 + dy * w1);
  ctx.quadraticCurveTo(mx + dx * ww, my + dy * ww, x0 + dx * w0, y0 + dy * w0);
  ctx.closePath();
  const g = ctx.createLinearGradient(x0 - dx * w0, y0 - dy * w0, x0 + dx * w0, y0 + dy * w0);
  g.addColorStop(0, c0); g.addColorStop(0.52, c1);
  g.addColorStop(0.88, e0 || 'rgba(160,105,30,.30)');                 // 默认=奶蛙的暖色边缘
  g.addColorStop(1, e1 || 'rgba(150,95,25,.42)');
  ctx.fillStyle = g; ctx.fill();
}
/* 四肢末端：黄 → 灰的渐变（参考图正是这样过渡的） */
function grayTip(x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, C.limbTop); g.addColorStop(0.4, C.limbMid); g.addColorStop(0.75, C.limbLo); g.addColorStop(1, C.limbDeep);
  return g;
}

function soft(cx, cy, rx, ry, base, rot, hi, lo) {
  ell(cx, cy, rx, ry, rot); ctx.fillStyle = base; ctx.fill();
  const g = ctx.createRadialGradient(cx - rx * 0.34, cy - ry * 0.46, 1, cx, cy, Math.max(rx, ry) * 1.3);
  g.addColorStop(0, hi || 'rgba(255,255,255,.30)');
  g.addColorStop(0.46, 'rgba(255,255,255,0)');
  g.addColorStop(1, lo || 'rgba(150,92,22,.24)');
  ctx.save(); ell(cx, cy, rx, ry, rot); ctx.clip(); ctx.fillStyle = g;
  ctx.fillRect(cx - rx * 2.2, cy - ry * 2.2, rx * 4.4, ry * 4.4); ctx.restore();
}
/* 多个椭圆的并集路径（先 moveTo 再 ellipse，避免子路径之间连出直线） */
function unionEll(list) {
  ctx.beginPath();
  for (const e of list) {
    const rot = e[4] || 0;
    ctx.moveTo(e[0] + Math.cos(rot) * e[2], e[1] + Math.sin(rot) * e[3]);
    ctx.ellipse(e[0], e[1], e[2], e[3], rot, 0, TAU);
  }
}

/* --------------------------- 奶蛙（主角 / 爸爸） ---------------------------
 * 明黄色梨形胖身体，头身一体没有脖子，大肚子，头顶两侧凸出大眼（浅绿眼圈+黑瞳），
 * 短粗三指手臂 + 两趾青蛙脚。设计身高 120，脚底在 y=0。
 * o = { mode:'run'|'jump'|'slide'|'idle'|'sit'|'scared'|'fall'|'dizzy', ph:相位,
 *       eyes:'normal'|'star'|'wide'|'shut'|'dead', mouth, tilt, hold }
 */
function drawNaiwaFront(o) {
  o = o || {};
  const mode = o.mode || 'run', ph = o.ph || 0, eyes = o.eyes || 'normal';
  const s1 = Math.sin(ph);
  let bob = 0, lean = 0;
  if (mode === 'run') bob = -Math.abs(s1) * 3.2;
  if (mode === 'scared') { bob = -Math.abs(s1) * 4.6; lean = 0.14; }
  if (mode === 'jump') bob = -3;
  if (mode === 'fall') lean = -0.5;
  if (mode === 'dizzy') { lean = Math.sin(ph * 2) * 0.14; bob = Math.sin(ph * 3) * 2; }
  if (mode === 'sit') bob = Math.sin(ph) * 1.2;
  ctx.save();
  if (lean) { ctx.translate(0, -50); ctx.rotate(lean); ctx.translate(0, 50); }

  if (mode === 'slide') {                                            // 滑铲：压扁 + 双腿前伸
    for (const sg of [-1, 1]) {
      limb(sg * 8, -18, 8, sg * 33, -12 + (sg < 0 ? 5 : 0), 5.5, C.nMid, C.nBot);
      ell(sg * 38, -10 + (sg < 0 ? 5 : 0), 11.5, 6.8, sg * 0.2); ctx.fillStyle = grayTip(sg * 28, -16, sg * 48, -3); ctx.fill();
    }
    ctx.save(); ctx.translate(0, -3); ctx.scale(1.14, 0.4); naiwaBlob(0); naiwaFace(0, -104, 1, eyes, o); ctx.restore();
    limb(-24, -24, 7, -35, -11, 5, C.nMid, C.nBot);
    ell(-37, -9, 7.6, 6.6); ctx.fillStyle = grayTip(-32, -17, -42, -1); ctx.fill();
    ctx.restore(); return;
  }

  for (const side of [-1, 1]) {                                      // ---- 锥形长腿，末端灰脚掌 ----
    const p = ph + (side > 0 ? Math.PI : 0);
    let fx, fy;
    if (mode === 'run' || mode === 'scared') { fx = side * 15 + Math.sin(p) * 13; fy = -2 - Math.max(0, Math.sin(p)) * 19; }
    else if (mode === 'jump') { fx = side * 18; fy = -22; }
    else if (mode === 'sit') { fx = side * 14 + 17; fy = -9; }
    else if (mode === 'fall') { fx = side * 16 + Math.sin(p) * 8; fy = -13; }
    else { fx = side * 15; fy = -3; }
    const kx = (side * 12 + fx) / 2 + side * 2;
    limb(side * 12, -20 + bob, 13.5, kx, -12 + bob, 9.5, C.nMid, C.nBot);
    limb(kx, -12 + bob, 9.5, fx, fy + 3, 6.5, C.nBot, C.nDeep);
    ell(fx, fy, 12.5, 7.6, side * -0.05); ctx.fillStyle = grayTip(fx - 10, fy - 6, fx + 10, fy + 6); ctx.fill();
    ctx.save(); ctx.globalAlpha = 0.45; line([[fx - 1, fy - 5], [fx - 1, fy + 5]], '#4E4238', 1.3); ctx.restore();
  }
  naiwaBlob(bob);
  for (const side of [-1, 1]) {                                      // ---- 长手臂，末端渐变灰手 ----
    const p = ph + (side > 0 ? Math.PI : 0);
    let hx, hy, shX = side * 29, shY = -78 + bob;
    if (mode === 'run' || mode === 'dizzy') { hx = side * 35 + Math.sin(p + Math.PI) * 4; hy = -40 + bob + Math.cos(p) * 12; }
    else if (mode === 'jump' || mode === 'scared' || mode === 'fall') { hx = side * 27; hy = -104 + bob; shX = side * 27; }
    else if (mode === 'sit') { hx = side * 18; hy = -54 + bob; }
    else { hx = side * 34; hy = -30 + bob; }
    const ex = (shX + hx) / 2 + side * 4, ey = (shY + hy) / 2;
    limb(shX, shY, 9, ex, ey, 7.4, C.nMid, C.nBot);
    limb(ex, ey, 7.4, hx, hy, 5.8, C.nBot, C.nDeep);
    ell(hx, hy + 2, 7.4, 8.6, side * 0.08); ctx.fillStyle = grayTip(hx, hy - 8, hx, hy + 11); ctx.fill();
    for (let i = -1; i <= 1; i++) { ell(hx + i * 4, hy + 8.6, 2.2, 3, i * 0.16); ctx.fillStyle = '#5B4D42'; ctx.fill(); }
  }
  if (o.hold === 'phone') drawPhone(16, -52 + bob);
  naiwaFace(0, -104 + bob, 1, o.hold ? 'shut' : eyes, o);
  ctx.restore();
}

/* 奶蛙的脸：头顶两侧凸出的大眼（浅绿眼圈 + 大黑瞳）+ 小而微扬的嘴 */
function naiwaFace(hx, hy, k, eyes, o) {
  const ey = hy - 4, ex = 10.5;                                      // 参考图：两眼靠近、位于头顶偏下
  for (const side of [-1, 1]) {
    const x = hx + side * ex * k, y = ey, r = (eyes === 'wide' ? 9.6 : 8.6) * k;
    if (eyes === 'star') { star(x, y, 10 * k, 4 * k, 5, (o.ph || 0) * 1.6 * side, '#FFF3B0'); star(x, y, 5.4 * k, 2 * k, 5, -(o.ph || 0) * 2.4, '#FFFFFF'); continue; }
    if (eyes === 'dead') { line([[x - 5.5 * k, y - 5.5 * k], [x + 5.5 * k, y + 5.5 * k]], C.ink, 3 * k); line([[x - 5.5 * k, y + 5.5 * k], [x + 5.5 * k, y - 5.5 * k]], C.ink, 3 * k); continue; }
    if (eyes === 'shut') { arc(x, y + 1, 6.5 * k, Math.PI * 0.15, Math.PI * 0.85, '#5A4632', 2.6 * k); continue; }
    sE2(x, y, r, r * 1.02, '#93E2A4', C.iris, C.irisLo);             // 绿虹膜：渐变，不描边
    ell(x + side * r * 0.06, y + r * 0.04, r * 0.66, r * 0.69); ctx.fillStyle = '#141009'; ctx.fill();
    fE(x - r * 0.26, y - r * 0.34, r * 0.2, r * 0.2, 'rgba(255,255,255,.92)');
    ctx.save(); ctx.globalAlpha = 0.42; fE(x, y + r * 0.95, r * 0.78, r * 0.2, 'rgba(120,86,36,.6)'); ctx.restore();
  }
  const my = hy + 13 * k;                                            // 嘴：一条细线，微微上扬
  if (eyes === 'wide') {
    ell(hx, my + 3.5 * k, 5 * k, 6 * k); ctx.fillStyle = '#7A4038'; ctx.fill();
    fE(hx, my + 6 * k, 3 * k, 2.2 * k, '#EE8A8A');
  } else {
    ctx.strokeStyle = 'rgba(88,60,38,.92)'; ctx.lineWidth = 1.9 * k; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx - 8.5 * k, my - 0.6 * k);
    ctx.quadraticCurveTo(hx + 1 * k, my + 3.4 * k, hx + 9 * k, my + 0.2 * k); ctx.stroke();
    ctx.save(); ctx.globalAlpha = 0.2; fE(hx + 1 * k, my + 4.8 * k, 6 * k, 1.6 * k, '#8A5A30'); ctx.restore();
  }
}

function drawDoubaoFront(o) {

  fE(-8, -130, 9, 26, '#FFFFFF', -0.16);

  ell(0, -153.6, 7.4, 3.4); ctx.fillStyle = C.skinLo; ctx.fill();

    else if (o.hips) { hx = side * 25; hy = -112; }
    else if (mode === 'run') { hx = side * 23 + Math.sin(p) * 15; hy = -104 + Math.cos(p) * 12; }

  doubaoHead(o);
  ctx.restore();
}

/* 怒气符号（井字青筋）+ 火苗 */
function angerMark(x, y, s, t) {                                      // s = 像素尺寸
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 5) * 0.14);
  ctx.strokeStyle = '#E8543F'; ctx.lineWidth = Math.max(1.6, s * 0.2); ctx.lineCap = 'round';
  const r = s * 0.5, d = s * 0.13;
  ctx.beginPath();
  for (const q of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { ctx.moveTo(q[0] * r, q[1] * r); ctx.lineTo(q[0] * d, q[1] * d); }
  ctx.stroke(); ctx.restore();
}
function flamePuff(x, y, s, t) {                                      // s = 像素尺寸，火苗往上窜
  for (let i = 0; i < 3; i++) {
    const a = t * 3 + i * 2.1, k = (Math.sin(a) + 1) / 2;
    ctx.save(); ctx.globalAlpha = 0.5 + k * 0.35;
    fE(x + Math.cos(a * 0.7) * s * 0.5, y - s * (0.75 + i * 0.72 + k * 0.4),
      s * (0.48 - i * 0.1), s * (0.66 - i * 0.13), i % 2 ? '#FFC93C' : '#FF7A5C');

  }

    for (const pass of [0, 1]) {

  }
  sE2(0, hy + 16, 30, 22, '#FFD8DE', C.cowPink, '#EFA0AE');             /* 粉色大猪鼻 */
  for (const side of [-1, 1]) sE2(side * 10, hy + 12, 4.6, 6.2, '#D98D9C', '#C97C8C', '#A85E6C');
  ctx.strokeStyle = '#C97C8C'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';   /* 嘴角一撇 */
  ctx.beginPath(); ctx.moveTo(-13, hy + 27); ctx.quadraticCurveTo(3, hy + 32, 14, hy + 25); ctx.stroke();
  for (const side of [-1, 1]) {                                        /* 半睁吊梢眼 */
    const x = side * 15, y = hy - 9;
    ctx.save(); ctx.beginPath(); ctx.rect(x - 11, y - 2.5, 22, 13); ctx.clip();

    ell(x, y - 3.5, 10.8, 5.6); ctx.fillStyle = C.cow; ctx.fill();     // 下垂的眼皮
    ctx.save(); ctx.globalAlpha = 0.5; sE(x, y + 3, 10, 6.4, '#B07E12', 1.2); ctx.restore();

  }
  ctx.restore();
}

  }
  const hy = -98;
  sE2(0, hy, 27, 25, '#FFD95E', C.roo, C.rooD);                                  // 头
  sE2(0, hy + 14, 17, 13, '#FFD95E', C.roo, C.rooD);

  ctx.save(); ctx.globalAlpha = 0.4; fE(-3.4, hy + 13, 4, 2.6, '#FFFFFF', -0.4); ctx.restore();

  const cloth = [[-12, '#F4A8B8', '#D9849A'], [1, '#A8D8F0', '#7FB4D0'], [13, '#C8E8A8', '#9CC47C']];
  for (const c of cloth) {
    const x = c[0], y = -74 + Math.abs(x) * 0.05, sw = Math.sin(t * 2 + x) * 0.04;
    ctx.save(); ctx.translate(x, y); ctx.rotate(sw);
    fPoly([[-7, 0], [7, 0], [9, 36], [-9, 36]], c[1]);
    ctx.save(); ctx.globalAlpha = 0.25; fPoly([[-7, 0], [-2, 0], [-4, 36], [-9, 36]], '#FFFFFF'); ctx.restore();
    fE(-7, 1, 2.6, 2.6, c[2]); fE(7, 1, 2.6, 2.6, c[2]);
    ctx.restore();
  }
}

/* 地面投影 */
function shadow(x, y, rx, ry, a) { ctx.save(); ctx.globalAlpha = a == null ? 0.16 : a; fE(x, y, rx, ry, '#4A3358'); ctx.restore(); }/* ============================ 7. 背景与跑道 ============================ */
let SKY = null, GROUND = null;
function buildGradients() {
  SKY = ctx.createLinearGradient(0, 0, 0, H * 0.62);                 // 天空：天蓝 -> 奶粉
  SKY.addColorStop(0, '#7FCDF2'); SKY.addColorStop(0.45, '#BFE6FA'); SKY.addColorStop(1, '#FFE9D8');
  GROUND = ctx.createLinearGradient(0, H * CFG.HORIZON, 0, H);
  GROUND.addColorStop(0, '#BEE39F'); GROUND.addColorStop(0.5, '#A8D88A'); GROUND.addColorStop(1, '#96CC7C');
}

const clouds = [];
for (let i = 0; i < 7; i++) clouds.push({ x: Math.random(), y: rnd(0.04, 0.26), s: rnd(0.5, 1.15), v: rnd(0.4, 1.4) });
const houses = [];
for (let i = 0; i < 14; i++) houses.push({ w: rnd(0.13, 0.22), h: rnd(0.05, 0.10), c: i % 3, roof: chance(0.62) });

function drawSky(t, scrollZ) {
  const hy = H * CFG.HORIZON;
  ctx.fillStyle = SKY; ctx.fillRect(0, 0, W, hy + 1);
  /* ---------- 第一层（最慢）：太阳 + 云 ---------- */
  const sx = W * 0.76, sy = H * 0.095;
  ctx.save();
  ctx.globalAlpha = 0.16; fE(sx, sy, 62, 62, '#FFF6C8');
  ctx.globalAlpha = 0.30; fE(sx, sy, 42, 42, '#FFF6C8');
  ctx.globalAlpha = 0.70; fE(sx, sy, 27, 27, '#FFF3B0');
  ctx.globalAlpha = 1; fE(sx, sy, 20, 20, '#FFFDF0'); ctx.restore();
  for (const c of clouds) {
    c.x -= c.v * 0.00010; if (c.x < -0.3) c.x = 1.3;                 // 云：极慢
    const x = ((c.x * W - scrollZ * 0.006) % (W * 1.6) + W * 1.6) % (W * 1.6) - W * 0.3;
    const y = c.y * H, k = c.s * (H / 640) * 23;
    ctx.save(); ctx.globalAlpha = 0.95;
    for (const o of [[-1.45, 0.18, 0.8], [-0.55, -0.3, 1.05], [0.5, -0.05, 0.95], [1.45, 0.25, 0.65]])
      fE(x + o[0] * k, y + o[1] * k * 0.5, o[2] * k, o[2] * k * 0.74, '#FFFFFF');
    fRR(x - k * 1.95, y + k * 0.05, k * 3.9, k * 0.66, k * 0.33, '#FFFFFF');
    ctx.restore();
  }
  /* ---------- 第二层（慢）：远山 ---------- */
  ctx.fillStyle = '#B6D3E4'; ctx.beginPath(); ctx.moveTo(0, hy);
  for (let i = 0; i <= 14; i++) {
    const x = (i / 14) * W, hgt = Math.sin(i * 1.9 + 0.5) * 0.5 + 0.5;
    ctx.lineTo(x, hy - hgt * H * 0.05 - H * 0.006);
  }
  ctx.lineTo(W, hy); ctx.closePath(); ctx.fill();
  /* ---------- 第三层（中）：房屋剪影，比近处暗、小 ---------- */
  const step = W * 0.19, base = hy + H * 0.016;
  let x0 = -((scrollZ * 0.03) % step) - step;
  for (let i = 0, x = x0; x < W + step; i++, x += step) {
    const hh = houses[((i % 14) + 14) % 14], w2 = W * hh.w * 0.92, h2 = H * hh.h * 0.92;
    ctx.save(); ctx.globalAlpha = 0.85;
    fRR(x, base - h2, w2, h2 + 3, 3, ['#D2AE96', '#C4A08C', '#DCBBA2'][hh.c]);
    if (hh.roof) fPoly([[x - 4, base - h2 + 1], [x + w2 + 4, base - h2 + 1], [x + w2 / 2, base - h2 - h2 * 0.46]], '#A9614F');
    ctx.globalAlpha = 0.4;
    fRR(x + w2 * 0.16, base - h2 * 0.74, w2 * 0.22, h2 * 0.28, 2, '#FFF3C0');
    fRR(x + w2 * 0.58, base - h2 * 0.74, w2 * 0.22, h2 * 0.28, 2, '#FFF3C0');
    ctx.restore();
  }
  ctx.fillStyle = GROUND; ctx.fillRect(0, hy, W, H - hy + 1);        // 草地
}

/* 三条轨道的透视跑道 */
function drawRoad(scrollZ) {
  const vx = W / 2, vy = H * CFG.HORIZON, sB = scaleAtBottom();
  /* 路面：一个顶点在消失点的三角形 → 左右两条边天然笔直 */
  ctx.fillStyle = '#F0E6D2';
  ctx.beginPath();
  ctx.moveTo(vx, vy);
  ctx.lineTo(vx + roadHalf(sB), H);
  ctx.lineTo(vx - roadHalf(sB), H);
  ctx.closePath(); ctx.fill();
  /* 横向纹理带：随速度向后流动，强化速度感 */
  const TP = 150;
  for (let i = 0; i < 26; i++) {
    const z = i * TP - (scrollZ % TP); if (z < -100) continue;
    const sa = pScale(Math.max(z, -90)), sb = pScale(z + TP * 0.5);
    if (sa <= 0.02) continue;
    const yA = pY(sa), yB = pY(sb), hA = roadHalf(sa), hB = roadHalf(sb);
    ctx.globalAlpha = 0.13 * Math.min(1, sa * 1.8);
    ctx.beginPath();
    ctx.moveTo(vx - hA, yA); ctx.lineTo(vx + hA, yA); ctx.lineTo(vx + hB, yB); ctx.lineTo(vx - hB, yB);
    ctx.closePath(); ctx.fillStyle = i % 2 ? '#E2D4BC' : '#FBF5E8'; ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* 左右外边线：白色实线，近处粗 4px、远处细 1px（梯形→依然是直线） */
  for (const sg of [-1, 1]) {
    const fA = 0.05, fB = sB;
    const tA = lerp(1, 4, fA / sB) / 2, tB = lerp(1, 4, fB / sB) / 2;
    const xa = vx + sg * roadHalf(fA), ya = pY(fA);
    const xb = vx + sg * roadHalf(fB), yb = pY(fB);
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.moveTo(xa - tA, ya); ctx.lineTo(xa + tA, ya); ctx.lineTo(xb + tB, yb); ctx.lineTo(xb - tB, yb);
    ctx.closePath(); ctx.fill();
  }
  /* 两条分道线：路宽 1/3、2/3 处，白色虚线，段长 30·scale、间隔 20·scale */
  const DASH = 34, GAP = 23, PER = DASH + GAP;
  for (const u of [-1 / 3, 1 / 3]) {
    for (let i = -1; i < 46; i++) {
      const z0 = i * PER - (scrollZ % PER), z1 = z0 + DASH;
      if (z1 < -80 || z0 > CFG.Z_FAR + 260) continue;
      const sa = pScale(Math.max(z0, -70)), sb = pScale(z1);
      if (sa <= 0.03) continue;
      const yA = pY(sa), yB = pY(sb);
      const tA = Math.max(0.7, 2.6 * sa), tB = Math.max(0.7, 2.6 * sb);
      const xa = vx + u * roadHalf(sa), xb = vx + u * roadHalf(sb);
      ctx.globalAlpha = 0.92 * Math.min(1, sa * 2.6);
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.moveTo(xa - tA, yA); ctx.lineTo(xa + tA, yA); ctx.lineTo(xb + tB, yB); ctx.lineTo(xb - tB, yB);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  /* 地平线雾霭：让远处冒出来的东西有过渡 */
  const hz = ctx.createLinearGradient(0, vy - H * 0.03, 0, vy + H * 0.07);
  hz.addColorStop(0, 'rgba(255,246,232,.95)'); hz.addColorStop(1, 'rgba(255,246,232,0)');
  ctx.fillStyle = hz; ctx.fillRect(0, vy - H * 0.03, W, H * 0.1);
}

/* 路边景物（树 / 灌木 / 路灯 / 小花），按深度滚动 */
const SIDE_N = 34, SIDE_STEP = 132, SIDE = [];
for (let i = 0; i < SIDE_N; i++) SIDE.push({ z: i * SIDE_STEP, side: i % 2 ? 1 : -1, kind: rndI(0, 4), s: rnd(0.82, 1.25) });
function drawSideProps(scrollZ) {
  const span = SIDE_N * SIDE_STEP, list = [];
  for (const p of SIDE) {
    let z = p.z - (scrollZ % span);
    while (z < -150) z += span;
    if (z < CFG.Z_FAR + 400) list.push([z, p]);
  }
  list.sort((a, b) => b[0] - a[0]);                                   // 远的先画
  for (const it of list) {
    const z = it[0], p = it[1], sc = pScale(z); if (sc <= 0.02) continue;
    const x = W / 2 + p.side * roadHalf(sc) * (p.kind === 4 ? 2.15 : 1.66);
    const y = pY(sc), k = sc * (H / 640) * 66 * p.s;
    const fade = clamp((CFG.Z_FAR + 380 - z) / 300, 0, 1);
    ctx.save(); ctx.globalAlpha = fade;
    shadow(x, y, k * 0.46, k * 0.13, 0.13);
    if (p.kind === 0) {
      cap(x, y, x, y - k * 1.15, k * 0.17, '#A87F50');
      cap(x, y - k * 0.8, x - p.side * k * 0.3, y - k * 1.1, k * 0.09, '#A87F50');
      fE(x, y - k * 1.55, k * 0.58, k * 0.64, '#82C16C'); fE(x - k * 0.4, y - k * 1.28, k * 0.42, k * 0.44, '#98D482');
      fE(x + k * 0.42, y - k * 1.34, k * 0.4, k * 0.42, '#72B25E'); fE(x, y - k * 2.02, k * 0.36, k * 0.36, '#A6DE8E');
    } else if (p.kind === 1) {
      fE(x, y - k * 0.24, k * 0.52, k * 0.32, '#82C16C'); fE(x - k * 0.3, y - k * 0.13, k * 0.34, k * 0.23, '#98D482');
      fE(x + k * 0.32, y - k * 0.16, k * 0.31, k * 0.21, '#72B25E');
      fE(x - k * 0.1, y - k * 0.38, k * 0.09, k * 0.09, '#F7A8B8'); fE(x + k * 0.24, y - k * 0.3, k * 0.08, k * 0.08, '#FFE08A');
    } else if (p.kind === 2) {
      cap(x, y, x, y - k * 2.25, k * 0.1, '#8E96A4');
      cap(x, y - k * 2.2, x - p.side * k * 0.44, y - k * 2.36, k * 0.09, '#8E96A4');
      ctx.save(); ctx.globalAlpha = fade * 0.5; fE(x - p.side * k * 0.48, y - k * 2.32, k * 0.3, k * 0.3, '#FFF3B0'); ctx.restore();
      fE(x - p.side * k * 0.48, y - k * 2.3, k * 0.17, k * 0.13, '#FFF7D8');
    } else if (p.kind === 3) {
      for (let i = 0; i < 3; i++) { const fx = x + (i - 1) * k * 0.26, fy = y - k * (0.16 + i * 0.06);
        cap(fx, y, fx, fy, k * 0.055, '#72B25E'); fE(fx, fy, k * 0.105, k * 0.105, ['#F7A8B8', '#FFE08A', '#FFFFFF'][i]); }
    } else {                                                          // 小房子（近景层，按透视排列）
      const w2 = k * 0.92, h2 = k * 0.74;
      shadow(x, y, w2 * 0.62, k * 0.11, 0.13);
      fRR(x - w2 / 2, y - h2, w2, h2, k * 0.08, ['#E8C3A4', '#DDB6A6', '#F0D6BC'][Math.floor(p.z / SIDE_STEP) % 3]);
      fPoly([[x - w2 / 2 - k * 0.1, y - h2], [x + w2 / 2 + k * 0.1, y - h2], [x, y - h2 - k * 0.62]], '#C4796A');
      ctx.save(); ctx.globalAlpha = fade * 0.6;
      fRR(x - w2 * 0.3, y - h2 * 0.78, w2 * 0.24, h2 * 0.26, k * 0.04, '#FFF3C0');
      fRR(x + w2 * 0.08, y - h2 * 0.78, w2 * 0.24, h2 * 0.26, k * 0.04, '#FFF3C0');
      fRR(x - w2 * 0.1, y - h2 * 0.4, w2 * 0.2, h2 * 0.4, k * 0.03, '#A9714B'); ctx.restore();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}/* ============================ 8. 游戏数据与逻辑 ============================ */

  thr: [0, 0.32], pan: [0, 0.58], pick: [0, 1.7],
};
const DH = { stroller: 78, blocks: 68, line: 90, cow: 206, roo: 132, naiwa: 120, doubao: 214, baby: 82, item: 46 };

const G = {
  state: 'title', st: 0, t: 0,

try { G.best = parseInt(localStorage.getItem('naiwa_best') || '0', 10) || 0; } catch (e) { }
function saveBest() { try { if (Math.floor(G.score) > G.best) { G.best = Math.floor(G.score); localStorage.setItem('naiwa_best', String(G.best)); } } catch (e) { } }

const PH = () => H * CFG.P_SIZE;                        // 奶蛙的屏幕身高（所有尺寸的基准）
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* ---- 粒子 / 飘字 ---- */
function puff(x, y, n, col, spd, g, r) {
  for (let i = 0; i < n; i++) G.parts.push({
    x: x, y: y, vx: rnd(-1, 1) * spd, vy: rnd(-1.4, -0.1) * spd, g: g == null ? 900 : g,
    life: rnd(0.3, 0.75), max: 0.75, r: r ? rnd(r * 0.6, r * 1.3) : rnd(3, 8) * (H / 640), c: col || '#FFFFFF', star: chance(0.25)
  });
}
function pop(x, y, txt, col) { G.pops.push({ x: x, y: y, txt: txt, col: col || '#FFFFFF', life: 1 }); }

/* ---- 生成障碍 / 道具 ---- */
const OBS_TYPES = ['stroller', 'blocks', 'blocks', 'line', 'cow', 'roo', 'roo', 'cow', 'stroller', 'line'];
const EASY_TYPES = ['blocks', 'roo', 'blocks', 'cow', 'roo'];      // 开局只用容易跳/躲的障碍
function makeObs(lane, type) {
  return { kind: 'obs', type: type || pick(OBS_TYPES), lane: lane, z: CFG.Z_FAR + rnd(0, 60), ph: rnd(0, TAU), dead: 0, hop: 0, hitT: -1 };
}
function makePick(lane) {
  const r = Math.random();
  const type = r < 0.44 ? 'glowbottle' : r < 0.64 ? 'lollipop' : r < 0.86 ? 'walker' : 'pillow';
  return { kind: 'pick', type: type, lane: lane, z: CFG.Z_FAR + rnd(0, 40), ph: rnd(0, TAU), dead: 0 };
}
function spawnRow() {                                     // 至少留一条通路：最多同时堵两条轨道
  const hard = clamp(-0.10 + G.dist / 2600, 0, 0.5);              // 前 ~260m 不会同时堵两条道
  const n = chance(hard) ? 2 : 1;
  const lanes = shuffle([0, 1, 2]).slice(0, n);
  for (const ln of lanes) G.objs.push(makeObs(ln, G.dist < 320 ? pick(EASY_TYPES) : undefined));
  if (chance(0.42)) {
    const free = [0, 1, 2].filter(l => lanes.indexOf(l) < 0);
    if (free.length) G.objs.push(makePick(pick(free)));
  }
}

/* ---- 豆姐投掷 ---- */
const THR_LIST = ['bottle', 'slipper', 'plush', 'remote', 'diaper'];
function chooseThrow() {
  if (chance(CFG.BABY_RATE)) return 'baby';
  if (chance(CFG.PAN_RATE)) return 'pan';
  return pick(THR_LIST);
}
function startThrow() {
  let lane = chance(0.58) ? G.lane : rndI(0, 2);           // 优先仍玩家所在轨道
  for (let k = 0; k < 4; k++) {                            // 避开轨道上已有障碍，防止无解
    const bad = G.objs.some(o => o.kind === 'obs' && !o.dead && o.lane === lane && o.z > 40 && o.z < 780);
    if (!bad) break;
    lane = rndI(0, 2);
  }
  G.warn = { lane: lane, type: chooseThrow(), t: 0, dur: clamp(1.2 - G.guilt * 0.4, 0.75, 1.2), tz: 640 };
  G.dMode = 'throw'; G.dArm = 0;
  Audio.throwS();
}
function landThrow(w) {
  G.objs.push({ kind: 'thr', type: w.type, lane: w.lane, z: w.tz, ph: rnd(0, TAU), dead: 0, land: 1, spin: 0 });
  const s = pScale(w.tz);
  puff(pX(w.lane, s), pY(s), 8, '#FFE9C8', 130, 500);
}

/* ---- 玩家判定区间 ---- */
function playerBand() { if (G.slide > 0) return [0, 0.46]; return [G.jh, G.jh + 0.98]; }
function overlap(a, b) { return a[0] < b[1] && a[1] > b[0]; }
function mistake(v) { G.guilt = clamp(G.guilt + (v || 0.15), 0, 1); G.combo = 0; }/* ============================ 8b. 状态机与更新 ============================ */
const OBS_NAME = { stroller: '婴儿车', blocks: '积木堆', line: '晾衣绳', cow: '牛来', roo: '肥嘟嘟' };
const DEAD_T = 0.16;                                        // 被砸中后的残影存活时间
const THR_NAME = { bottle: '奶瓶', slipper: '拖鞋', plush: '毛绒玩具', remote: '遥控器', pan: '平底锅', diaper: '脏尿布', baby: '小孩' };
G.iframe = 0;

function resetRun() {
  G.speed = CFG.V_START; G.scrollZ = 0; G.dist = 0; G.score = 0;

}
function goto(s) { G.state = s; G.st = 0; }
function gameOver(cause) {
  if (G.state !== 'play') return;
  G.cause = cause; G.warn = null; goto('over'); G.guilt = 1; G.shake = 16; G.flash = 0.5;
  Audio.over(); saveBest();
  puff(pX(G.laneF, 1), H * CFG.BASE_Y, 22, '#FFE9A8', 260, 700);
}

/* ---- 输入处理 ---- */
function doJump() {
  G.jv = CFG.JUMP_V; G.jh = 0.001; G.ground = false; G.slide = 0; G.coyote = 0;
  Audio.jump(); puff(pX(G.laneF, 1), H * CFG.BASE_Y, 6, '#FFFFFF', 120, 400);
}
function handleAction(a) {
  if (G.state === 'title') { if (a === 'jump') IN.tap = true; return; }
  if (G.state === 'over') { if (a === 'jump' || a === 'restart') IN.tap = true; return; }
  if (G.state !== 'play') return;
  if (a === 'restart') { resetRun(); goto('play'); return; }
  if (G.stun > 0) return;                                       // 拖鞋：眩晕 1 秒，操作失灵
  if (a === 'left') { if (G.lane > 0) { G.lane--; Audio.swap(); } }
  else if (a === 'right') { if (G.lane < 2) { G.lane++; Audio.swap(); } }
  else if (a === 'jump') { if (G.ground || G.coyote > 0) doJump(); else G.jbuf = 0.13; }
  else if (a === 'slide') {
    if (!G.ground) { G.jv = -CFG.JUMP_V * 1.5; }                 // 空中按下 = 快速下坠接滑铲
    G.slide = CFG.SLIDE_T; Audio.slide();
    puff(pX(G.laneF, 1), H * CFG.BASE_Y, 5, '#FFFFFF', 100, 300);
  }
}

/* ---- 撞击 / 拾取 ---- */
function smash(o, col) {
  o.dead = 0.001;
  const s = pScale(Math.max(o.z, -60));
  puff(pX(o.lane, s), pY(s) - PH() * s * 0.4, 14, col || '#FFD93D', 300, 900);
  G.shake = Math.max(G.shake, 7); Audio.smash();
}
function hitObstacle(o) {
  if (G.iframe > 0 || G.inv > 0) { if (G.inv > 0) { smash(o, '#F7A8C8'); G.score += 20; } return; }
  if (G.dash > 0) { smash(o); G.score += 30; pop(pX(G.laneF, 1), H * 0.40, '撞飞 +30', '#8FD3E8'); return; }
  if (o.type === 'cow') {                                        // 牛来：被顶飞，减速但不结束
    smash(o, '#F3C6CC');
    G.slow = Math.max(G.slow, 1.6); G.iframe = 0.9; mistake(0.2);
    G.shake = 13; Audio.hit();
    pop(pX(G.laneF, 1), H * 0.40, '被顶飞！', '#F08080');
    return;
  }
  o.dead = 0.001; smash(o, '#FFD9A8');
  gameOver('一头撞上' + OBS_NAME[o.type]);
}
function hitThrow(o) {
  if (G.inv > 0) { smash(o, '#F7A8C8'); return; }
  if (G.shield > 0) {                                            // 枕头护盾：挡一次投掷
    G.shield = 0; smash(o, '#FFFDF6'); o.dead = 0.001;
    pop(pX(G.laneF, 1), H * 0.40, '枕头挡下！', '#FFFFFF'); Audio.pick(); return;
  }
  if (G.iframe > 0) return;
  o.dead = 0.001;
  const px = pX(G.laneF, 1), py = H * 0.43;
  if (o.type === 'baby') {                                       // 小孩：跳起来接住 = 加分
    if (G.jh > 0.18) {
      G.score += 300; G.combo++; G.guilt = clamp(G.guilt - 0.30, 0, 1);
      pop(px, py - H * 0.03, '接住小孩 +300', '#FFE08A'); Audio.grab();
      for (let i = 0; i < 26; i++) puff(px, py + 40, 1, ['#FFD93D', '#F7A8B8', '#A8D8F0', '#BEE8A8'][i % 4], 320, 620, 6);
      G.flash = 0.25; return;
    }
    G.babyHead = 3; G.slow = Math.max(G.slow, 3); mistake(0.12); Audio.hit();
    pop(px, py, '娃挂头上了…', '#FFD93D'); G.shake = 8; return;
  }
  mistake(0.14); G.iframe = 0.8; Audio.hit(); G.shake = 9;
  switch (o.type) {
    case 'bottle': G.slow = Math.max(G.slow, 2); pop(px, py, '被奶瓶砸中！速度掉了', '#A8D8F0'); break;
    case 'slipper': G.stun = Math.max(G.stun, 1); pop(px, py, '被拖鞋拍晕！', '#F7A8B8'); break;
    case 'plush': G.score = Math.max(0, G.score - 100); pop(px, py, '毛绒玩具 -100', '#C8C8D8'); break;
    case 'remote': G.glitch = Math.max(G.glitch, 1); pop(px, py, '遥控器！屏幕花啦', '#BEE8A8'); break;
    case 'diaper': G.diaper = Math.max(G.diaper, 3.5); pop(px, py, '好臭的尿布…', '#D8E8B0'); break;
    case 'pan': gameOver('一记平底锅拍在背上'); break;
  }
}
function grabPickup(o) {
  o.dead = 0.001; Audio.pick();
  const px = pX(G.laneF, 1), py = H * 0.40;
  if (o.type === 'glowbottle') { G.score += 150; pop(px, py, '发光奶瓶 +150', '#FFE08A'); }
  else if (o.type === 'lollipop') { G.inv = CFG.INV_T; pop(px, py, '棒棒糖：无敌 5 秒！', '#F7A8B8'); }
  else if (o.type === 'walker') { G.dash = CFG.DASH_T; pop(px, py, '学步车：冲刺 5 秒！', '#8FD3E8'); }
  else if (o.type === 'pillow') { G.shield = 1; pop(px, py, '枕头：护盾 +1', '#FFFDF6'); }
  for (let i = 0; i < 12; i++) puff(px, py + 60, 1, '#FFF3B0', 220, 500, 5);
}

/* ---- 每帧更新 ---- */
function updatePlay(dt) {
  // 速度：随里程提升，冲刺/减速会临时改变
  let target = clamp(CFG.V_START + G.dist * 0.115, CFG.V_START, CFG.V_MAX);
  if (G.dash > 0) target *= 1.55;
  if (G.slow > 0 || G.babyHead > 0) target *= 0.62;
  G.speed = lerp(G.speed, target, clamp(dt * 3.2, 0, 1));
  G.scrollZ += G.speed * dt;
  const meters = G.speed * dt / 10;
  G.dist += meters; G.score += meters * 3.2;
  G.runPh += dt * (6.5 + G.speed / 90);

  // 横向换道（平滑插值）
  G.laneF += (G.lane - G.laneF) * clamp(dt / CFG.LANE_T, 0, 1);
  // 跳跃物理
  if (!G.ground) {
    G.jv -= CFG.GRAV * dt; G.jh += G.jv * dt;
    if (G.jh <= 0) { G.jh = 0; G.jv = 0; G.ground = true; Audio.land(); puff(pX(G.laneF, 1), H * CFG.BASE_Y, 5, '#FFFFFF', 110, 400); }
  } else G.coyote = 0.09;
  if (G.jbuf > 0) { G.jbuf -= dt; if (G.ground || G.coyote > 0) { G.jbuf = 0; doJump(); } }
  if (G.slide > 0) G.slide -= dt;
  // 状态计时
  ['stun', 'slow', 'glitch', 'diaper', 'babyHead', 'inv', 'dash', 'coyoteX', 'iframe'].filter(k => k !== 'coyoteX').forEach(k => { if (G[k] > 0) G[k] = Math.max(0, G[k] - dt); });
  if (G.laugh > 0) G.laugh = Math.max(0, G.laugh - dt);
  if (G.laughCd > 0) G.laughCd = Math.max(0, G.laughCd - dt);
  if (G.hint > 0) G.hint -= dt;
  // 豆姐：怒气随时间消退，追近后跟随玩家轨道
  G.guilt = clamp(G.guilt - dt * 0.028, 0, 1);
  G.dLane += (G.laneF - G.dLane) * clamp(dt * 1.7, 0, 1);
  G.dPh += dt * (7 + G.guilt * 5);
  if (G.dMode === 'throw') { G.dArm += dt / 0.5; if (G.dArm > 1.3) { G.dArm = -1; G.dMode = 'run'; } }
  // 投掷节奏
  if (G.warn) {
    G.warn.t += dt;
    if (G.warn.t >= G.warn.dur) { landThrow(G.warn); G.warn = null; }
  } else {
    G.throwTimer -= dt;
    if (G.throwTimer <= 0) {
      startThrow();
      const base = lerp(CFG.THROW_MAX, CFG.THROW_MIN, G.guilt);
      G.throwTimer = base * rnd(0.85, 1.2) * clamp(520 / G.speed, 0.62, 1.25);
    }
  }
  // 障碍生成
  G.rowTimer -= dt;
  if (G.rowTimer <= 0) {
    spawnRow();
    const ramp = clamp(G.dist / 2600, 0, 1);                        // 前期间距宽、后期变密
    G.rowTimer = lerp(rnd(820, 1180), rnd(430, 780), ramp) / G.speed;
  }
  // 实体推进 + 碰撞
  const pb = playerBand();
  for (let i = G.objs.length - 1; i >= 0; i--) {
    if (G.state !== 'play') break;
    const o = G.objs[i];
    if (o.dead > 0) { o.dead += dt; o.z += 420 * dt; if (o.dead > DEAD_T) G.objs.splice(i, 1); continue; }
    o.z -= G.speed * dt;
    o.ph += dt * (o.type === 'cow' ? 3.4 : o.type === 'roo' ? 4.2 : 6);
    if (o.kind === 'obs') {
      if (o.type === 'cow') o.z += 78 * dt;                      // 牛来慢悠悠向前走
      if (o.type === 'roo') { o.hop = Math.abs(Math.sin(o.ph * 0.9)); o.z += 46 * dt * o.hop; }
    }
    if (o.z < CFG.Z_DEAD) { G.objs.splice(i, 1); continue; }
    if (o.kind === 'thr' && o.z < -46 && !o.scored) {              // 扔空了 → 奶蛙回头嘲笑
      o.scored = 1;
      if (G.laughCd <= 0 && G.state === 'play') { G.laugh = 0.95; G.laughCd = 1.8; Audio.laugh(); }
    }
    if (o.kind === 'obs' && o.z < -46 && !o.scored) {              // 同轨道惊险躲过
      o.scored = 1;
      if (o.lane === G.lane) { G.combo++; const b = 20 * Math.min(G.combo, 6); G.score += b; pop(pX(G.laneF, 1), H * 0.38, '惊险躲过 +' + b, '#BEE8A8'); }
    }
    if (Math.abs(o.z) < 44 && Math.abs(o.lane - G.laneF) < 0.55 && !o.dead) {
      const band = o.kind === 'pick' ? BAND.pick
        : o.kind === 'thr' ? (o.type === 'pan' ? BAND.pan : o.type === 'baby' ? [0, 0.75] : BAND.thr)
        : BAND[o.type];
      if (o.kind === 'pick') grabPickup(o);
      else if (overlap(pb, band)) { if (o.kind === 'thr') hitThrow(o); else hitObstacle(o); }
    }
  }
  if (G.guilt >= 1) gameOver('被豆姐揪住了耳朵');
}/* ============================== 9. 渲染 ============================== */
function txt(s, x, y, size, color, align, weight, stroke) {
  ctx.font = (weight || 'bold') + ' ' + size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = size * 0.16; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

/* 圆润 + 双层描边的标题字（分数用） */
function txtRound(str, x, y, size, fill, align) {
  ctx.font = '900 ' + size + 'px "Arial Rounded MT Bold","Hiragino Maru Gothic ProN","YouYuan","幼圆","Microsoft YaHei",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.lineWidth = size * 0.30; ctx.strokeStyle = 'rgba(92,54,38,.5)'; ctx.strokeText(str, x, y);
  ctx.lineWidth = size * 0.13; ctx.strokeStyle = '#FFFFFF'; ctx.strokeText(str, x, y);
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}

/* ---- 单个实体 ---- */
/* 各障碍的设计宽度（含手臂 / 尾巴 / 立柱的最外沿） */
const DW = { stroller: 50, blocks: 58, line: 46, cow: 128, roo: 100 };
const LANE_FILL = 0.94;                                              // 最多吃掉所在车道的 94%
/* 先按高度定缩放，再用"车道限宽"回压，保证任何障碍都不会画到隔壁车道 */
function fitScale(k, type, sc) {
  const dw = DW[type]; if (!dw) return k;
  return Math.min(k, W * CFG.LANE_DX * sc * LANE_FILL / dw);
}

function drawEntity(o, t) {
  const sc = pScale(o.z); if (sc <= 0.02) return;
  const x = pX(o.lane, sc), y = pY(sc);
  const ph = PH() * sc * 0.9;                              // 该深度下的基准身高（留一点车道间隙）
  ctx.save();
  ctx.globalAlpha = clamp((CFG.Z_FAR + 260 - o.z) / 300, 0, 1) * (o.dead > 0 ? clamp(1 - o.dead / DEAD_T, 0, 1) : 1);
  if (o.kind === 'obs') {
    shadow(x, y, Math.min(ph * 0.44, W * CFG.LANE_DX * sc * 0.47), ph * 0.13, 0.17);
    if (o.type === 'cow') { ctx.translate(x, y); const k = fitScale(ph * 0.99 / DH.cow, 'cow', sc); ctx.scale(k, k); drawNiulai({ ph: o.ph }); }
    else if (o.type === 'roo') { ctx.translate(x, y); const k = fitScale(ph * 0.72 / DH.roo, 'roo', sc); ctx.scale(k, k); drawFeidudu({ ph: o.ph, hop: o.hop }); }
    else if (o.type === 'stroller') { ctx.translate(x, y); const k = fitScale(ph * 1.02 / DH.stroller, 'stroller', sc); ctx.scale(k, k); drawStroller(t); }
    else if (o.type === 'blocks') { ctx.translate(x, y); const k = fitScale(ph * 0.46 / DH.blocks, 'blocks', sc); ctx.scale(k, k); drawBlocks(t); }
    else if (o.type === 'line') { ctx.translate(x, y); const k = fitScale(ph * 0.52 / 38, 'line', sc); ctx.scale(k, k); drawClothesline(t); }
  } else if (o.kind === 'pick') {
    const fl = 0.56 + Math.sin(o.ph) * 0.1, cy = y - ph * fl;
    shadow(x, y, ph * 0.22, ph * 0.07, 0.13);
    ctx.save(); ctx.globalAlpha *= 0.45; fE(x, y, ph * 0.3, ph * 0.1, '#FFF6B0'); ctx.restore();
    ctx.translate(x, cy); const k = ph * 0.44 / 44; ctx.scale(k, k);
    ctx.rotate(Math.sin(o.ph * 0.7) * 0.16);
    drawItem(o.type, t);
  } else if (o.kind === 'thr') {
    if (o.type === 'baby') {
      shadow(x, y, ph * 0.21, ph * 0.065, 0.13);
      ctx.translate(x, y); const k = ph * 0.5 / DH.baby; ctx.scale(k, k);
      drawBaby({ mode: 'giggle', ph: o.ph });
    } else {
      const h = (o.type === 'pan' ? 0.56 : 0.32) * ph;
      shadow(x, y, h * 0.6, h * 0.18, 0.14);
      ctx.translate(x, y - h * 0.82); const k = h / 44; ctx.scale(k, k);
      ctx.rotate(Math.sin(o.ph * 0.6) * 0.12);
      drawItem(o.type, t);
    }
  }
  ctx.restore();
}

/* ---- 玩家（奶蛙） ---- */
function drawPlayer(t) {
  const ph = PH(), x = pX(G.laneF, 1), gy = H * CFG.BASE_Y;
  const jh = G.jh * ph, y = gy - jh;
  const lean = clamp((G.lane - G.laneF) * 0.5, -0.4, 0.4);
  shadow(x, gy + ph * 0.02, ph * 0.36 * (1 - G.jh * 0.45), ph * 0.11 * (1 - G.jh * 0.45), 0.22 - G.jh * 0.1);
  if (G.dash > 0) {                                                   // 冲刺拖影
    for (let i = 1; i <= 3; i++) {
      ctx.save(); ctx.globalAlpha = 0.13 * (4 - i);
      ctx.translate(x, y + i * ph * 0.06); ctx.scale(ph / DH.naiwa, ph / DH.naiwa);
      drawNaiwa({ view: 'back', mode: G.slide > 0 ? 'slide' : 'run', ph: G.runPh - i * 0.55 }); ctx.restore();
    }
  }
  ctx.save(); ctx.translate(x, y);
  if (G.inv > 0) {                                                    // 无敌彩虹光环
    ctx.save(); ctx.globalAlpha = 0.5 + Math.sin(t * 12) * 0.18;
    const cc = ['#FF9AA2', '#FFD93D', '#A8E090', '#8FD3E8', '#C7A8F0', '#FFFFFF', '#F7A8B8'];
    for (let i = 0; i < 7; i++) { const a = t * 3 + i * TAU / 7; fE(Math.cos(a) * ph * 0.46, -ph * 0.55 + Math.sin(a) * ph * 0.52, ph * 0.055, ph * 0.055, cc[i]); }
    ctx.restore();
  }
  let mode = G.slide > 0 ? 'slide' : (!G.ground ? (G.jv > 0 ? 'jump' : 'scared') : 'run');
  if (G.laugh > 0 && G.ground && G.slide <= 0) mode = 'laugh';
  const eyes = (G.stun > 0 || G.iframe > 0) ? 'star' : 'normal';
  const phArg = mode === 'laugh' ? (0.95 - G.laugh) * 30 : G.runPh;
  ctx.translate(0, -ph * 0.5); ctx.rotate(lean * 0.45); ctx.translate(0, ph * 0.5);
  ctx.scale(ph / DH.naiwa, ph / DH.naiwa);
  drawNaiwa({ view: 'back', mode: mode, ph: phArg, eyes: eyes });
  if (G.dash > 0) { ctx.save(); ctx.translate(0, -30); ctx.scale(1.32, 1.32); drawItem('walker', t); ctx.restore(); }
  if (G.laugh > 0 && mode === 'laugh') {                              // 嘲笑：飘字 + 声波弧
    const k = 1 - G.laugh / 0.95, al = Math.min(1, G.laugh / 0.22);
    ctx.save(); ctx.globalAlpha = al;
    const ty = -142 - k * 20;
    txtRound('哈哈哈', 0, ty, 26, '#FFD93D', 'center');
    for (let i = 0; i < 3; i++) {
      const aa = -0.85 + i * 0.85;
      arc(Math.cos(aa) * 40, ty + 16 + Math.sin(aa) * 8, 7 + i * 2.5, Math.PI * 0.12, Math.PI * 0.88, '#FFFFFF', 2.2);
    }
    ctx.restore();
  }
  if (G.babyHead > 0) {                                               // 小孩骑在头上（脸朝镜头更俏皮）
    ctx.save(); ctx.translate(0, -104 + Math.sin(t * 9) * 3); ctx.scale(0.5, 0.5);
    drawBaby({ mode: 'giggle', ph: t * 6 }); ctx.restore();
  }
  ctx.restore();
  if (G.shield > 0) {
    ctx.save(); ctx.globalAlpha = 0.5 + Math.sin(t * 5) * 0.12;
    sE(x, y - ph * 0.52, ph * 0.54, ph * 0.66, '#FFFDF6', 3);
    ctx.globalAlpha = 0.14; fE(x, y - ph * 0.52, ph * 0.54, ph * 0.66, '#FFFFFF'); ctx.restore();
  }
  if (G.stun > 0) for (let i = 0; i < 3; i++) { const a = t * 6 + i * TAU / 3; star(x + Math.cos(a) * ph * 0.36, y - ph * 1.06 + Math.sin(a) * ph * 0.11, ph * 0.06, ph * 0.024, 5, a, '#FFE08A'); }
  if (G.slow > 0 || G.babyHead > 0) { ctx.save(); ctx.globalAlpha = 0.9; fE(x + ph * 0.4, y - ph * 0.95 + Math.sin(t * 8) * 4, ph * 0.035, ph * 0.055, '#9FD8F0'); ctx.restore(); }
}

/* ---- 豆姐（画面下方逼近的妈妈） ---- */
function doubaoGeom() {
  const dist = 1 - clamp(G.guilt, 0, 1);                       // 0 = 贴得很近，1 = 落后很远
  const k = 1 - dist * 0.5;                                    // 大小 = scale * (1 - distance*0.5)
  const y = H * CFG.BASE_Y + H * 0.098 + dist * H * 0.13;      // 始终在奶蛙下方 = 在他身后
  const h = PH() * 1.10 * k;
  const x = clamp(pX(G.dLane, 1) - W * 0.13, W * 0.15, W * 0.85);
  return { d: 12, sc: k, x: x, y: y, h: h };
}
function drawDoubaoScene(t) {
  const g = doubaoGeom();
  shadow(g.x, g.y + g.h * 0.01, g.h * (0.30 - Math.abs(Math.sin(G.dPh)) * 0.02), g.h * 0.08, 0.16);
  ctx.save(); ctx.translate(g.x, g.y); ctx.scale(g.h / DH.doubao, g.h / DH.doubao);
  drawDoubaoChar({
    view: 'back', mode: 'run', ph: G.dPh, pump: 0.75 + G.guilt * 0.7,
    throwArm: !!G.warn, held: G.warn ? G.warn.type : null, arm: G.dArm,
  });
  ctx.restore();
  if (G.guilt > 0.45) {                                               // 追上来了：怒气符号 + 火苗
    const ang = clamp((G.guilt - 0.45) * 5, 0, 3) | 0;
    for (let i = 0; i < ang; i++) angerMark(g.x + (i - 1) * g.h * 0.3, g.y - g.h * 1.02, g.h * 0.15, t + i);
    if (G.guilt > 0.72) flamePuff(g.x + g.h * 0.34, g.y - g.h * 0.6, g.h * 0.2, t + 1.1);
  }
  if (G.state === 'play') {                                           // 脚下扬尘
    if (chance(0.22)) puff(g.x + rnd(-g.h * 0.2, g.h * 0.2), g.y, 1, 'rgba(255,240,220,.7)', 40, 60, g.h * 0.05);
  }
}


/* ---- 投掷预警 & 飞行物 ---- */
function drawWarn(t, layer) {
  if (!G.warn) return;
  const w = G.warn, sT = pScale(w.tz), xT = pX(w.lane, sT), yT = pY(sT);
  const k = clamp(w.t / w.dur, 0, 1), pulse = 0.6 + Math.sin(t * 16) * 0.4;
  if (layer === 'ground') {                                           // 落点警示圈
    ctx.save();
    ctx.globalAlpha = 0.35 + pulse * 0.4;
    ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 3.4; ctx.setLineDash([9, 7]); ctx.lineDashOffset = -t * 40;
    ctx.beginPath(); ctx.ellipse(xT, yT, PH() * sT * 0.5, PH() * sT * 0.16, 0, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.2 + pulse * 0.14; ctx.fillStyle = '#FF6B6B';
    ctx.beginPath(); ctx.ellipse(xT, yT, PH() * sT * 0.48, PH() * sT * 0.15, 0, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }
  /* --- 空中：落点上方悬浮提示 + 从豆姐手里甩出去的抛物线 --- */
  const iy = yT - PH() * sT * (2.0 - k * 0.5);
  ctx.save(); ctx.globalAlpha = 0.95; ctx.translate(xT, iy);
  const ik = PH() * sT * 0.36 / 44; ctx.scale(ik, ik);
  if (w.type === 'baby') { ctx.scale(44 / DH.baby * 1.15, 44 / DH.baby * 1.15); drawBaby({ mode: 'cry', ph: t * 5 }); }
  else drawItem(w.type, t);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.9;
  arc(xT, iy, PH() * sT * 0.36, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - k), '#FFFFFF', 3);
  ctx.restore();
  txt('!', xT, iy - PH() * sT * 0.62, PH() * sT * 0.55, '#FF6B6B', 'center', 'bold', '#FFFFFF');
  const fp = clamp((w.t - w.dur * 0.5) / (w.dur * 0.5), 0, 1);
  if (fp > 0 && fp < 1) {
    const g = doubaoGeom();
    const x0 = g.x + g.h * 0.1, y0 = g.y - g.h * 0.9;
    const px = lerp(x0, xT, easeOut(fp)), py = lerp(y0, yT - PH() * sT * 0.2, fp) - Math.sin(fp * Math.PI) * H * 0.11;
    const sc = lerp(g.sc, sT, fp) * PH() * 0.4 / 44;
    ctx.save(); ctx.translate(px, py); ctx.rotate(fp * 10); ctx.scale(sc, sc);
    if (w.type === 'baby') { ctx.scale(44 / DH.baby * 1.5, 44 / DH.baby * 1.5); drawBaby({ mode: 'fly', ph: fp * 6 }); }
    else drawItem(w.type, t);
    ctx.restore();
  }
}/* ---- 粒子 / 飘字 ---- */
function drawParticles(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];

/* ---- 通用：对话气泡（自动换行） ---- */
function drawBubble(x, y, w, text, spkX, size) {
  size = size || H * 0.0195;
  const F = sz => 'bold ' + sz + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  const per = Math.max(4, Math.floor((w - size * 3.6) / size / 1.22));   // 每行字数（留安全系数）
  const noStart = '，。！？…、）》”';                                      // 标点不置于行首
  const lines = []; let cur = '';
  for (const ch of text) {
    if (cur.length >= per && noStart.indexOf(ch) < 0) { lines.push(cur); cur = ch; }
    else cur += ch;
  }
  lines.push(cur);
  ctx.font = F(size); let mw = 1;                                        // 按实测再收一次字号，保证不出框
  for (const l of lines) mw = Math.max(mw, ctx.measureText(l).width);
  const fs2 = mw > w - size * 2.6 ? size * (w - size * 2.6) / mw : size;
  const lh = fs2 * 1.5, h = lines.length * lh + fs2 * 1.85;
  ctx.save();
  ctx.shadowColor = 'rgba(90,50,40,.18)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
  fRR(x, y, w, h, fs2 * 1.25, '#FFFFFF'); ctx.restore();
  ctx.beginPath();
  const tx = clamp(spkX, x + w * 0.22, x + w * 0.78), dir = spkX >= x + w / 2 ? 1 : -1;
  ctx.moveTo(tx, y + h - 2); ctx.lineTo(tx + dir * fs2 * 1.7, y + h + fs2 * 1.8); ctx.lineTo(tx + dir * fs2 * 0.3, y + h - 2);
  ctx.closePath(); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.font = F(fs2); ctx.fillStyle = '#6B4A3A'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((ln, i) => ctx.fillText(ln, x + w / 2, y + fs2 * 1.08 + i * lh));
  return h;
}

  const nx = lerp(-W * 0.22, W * 0.56, easeOut(p)), dx = nx - W * 0.40;
  ctx.save(); ctx.translate(dx, H * 0.745); ctx.scale(H * 0.26 / DH.doubao, H * 0.26 / DH.doubao);
  drawDoubaoChar({ mode: 'run', ph: t * 15, face: 'mad' }); ctx.restore();
  shadow(dx, H * 0.748, H * 0.075, H * 0.014, 0.16);
  ctx.save(); ctx.translate(nx, H * 0.745); ctx.scale(H * 0.20 / DH.naiwa, H * 0.20 / DH.naiwa);
  drawNaiwa({ mode: 'scared', ph: t * 17, eyes: 'wide' }); ctx.restore();
  shadow(nx, H * 0.748, H * 0.06, H * 0.012, 0.18);
  for (let i = 0; i < 4; i++) { const dxx = nx - W * 0.05 - i * W * 0.05; ctx.save(); ctx.globalAlpha = 0.5 - i * 0.1;
    fE(dxx, H * (0.735 + Math.sin(G.t * 14 + i) * 0.006), W * 0.035, H * 0.010, '#FFFFFF'); ctx.restore(); }
  txt('老婆！我错了我错了！！！', clamp(nx, W * 0.36, W * 0.64), H * 0.50, H * 0.028, '#FFFFFF', 'center', 'bold', 'rgba(120,70,50,.6)');
  txt('夺 门 而 逃 ！', W / 2, H * 0.16 + Math.sin(t * 12) * 4, H * 0.062, '#E8543F', 'center', '900', '#FFFFFF');
  if (st > 1.75) { ctx.save(); ctx.globalAlpha = clamp((st - 1.75) / 0.4, 0, 1); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  watermark();
}

/* ---- 结算：被抓住了 ---- */
function drawFallenScene(t) {
  const gy = H * CFG.BASE_Y, ph = PH();
  const px = pX(G.laneF, 1) - W * 0.055;
  const k = H * 0.30 / DH.doubao, gx = px + ph * 1.02, gfeet = gy + ph * 0.05;
  shadow(px, gy + ph * 0.02, ph * 0.5, ph * 0.12, 0.18);
  // 奶蛙四脚朝天、眼冒金星
  ctx.save(); ctx.translate(px - ph * 0.1, gy - ph * 0.14); ctx.rotate(-1.42 + Math.sin(t * 3) * 0.03);
  ctx.scale(ph / DH.naiwa, ph / DH.naiwa);
  drawNaiwa({ mode: 'fall', ph: t * 4, eyes: 'star' }); ctx.restore();
  for (let i = 0; i < 4; i++) { const a = t * 3 + i * TAU / 4; star(px - ph * 0.1 + Math.cos(a) * ph * 0.42, gy - ph * 0.5 + Math.sin(a) * ph * 0.16, ph * 0.055, ph * 0.022, 5, a, '#FFE08A'); }
  // 豆姐弯腰揪耳朵
  ctx.save(); ctx.translate(gx, gfeet); ctx.scale(k, k);
  drawDoubaoChar({ mode: 'stand', ph: t * 2, face: 'mad' }); ctx.restore();
  const shx = gx - 24 * k, shy = gfeet - 146 * k;
  cap(shx, shy, px + ph * 0.16, gy - ph * 0.62, 11 * k, C.skin);
  fE(px + ph * 0.18, gy - ph * 0.66, ph * 0.075, ph * 0.075, C.skin);
  angerMark(gx + ph * 0.42, gfeet - H * 0.315, H * 0.030, t);
  flamePuff(gx - ph * 0.5, gfeet - H * 0.20, H * 0.030, t);
  txt('知道错了没！', clamp(gx, W * 0.2, W * 0.70), gfeet - H * 0.335, H * 0.026, '#FFFFFF', 'center', 'bold', 'rgba(150,60,50,.7)');
}
function renderOver(t) {
  const k = easeOut(clamp((G.deadT - 0.75) / 0.45, 0, 1));
  if (k <= 0) return;
  const cw = W * 0.82, ch = H * 0.325, cx = (W - cw) / 2, cy = H * 0.115 + (1 - k) * H * 0.2;
  ctx.save(); ctx.globalAlpha = k;
  ctx.shadowColor = 'rgba(80,40,40,.35)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 10;
  fRR(cx, cy, cw, ch, 22, '#FFF8EC'); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#E8B93B'; ctx.lineWidth = 4; rrPath(cx, cy, cw, ch, 22); ctx.stroke();
  // 顶部装饰条
  ctx.save(); rrPath(cx, cy, cw, ch, 22); ctx.clip(); ctx.fillStyle = '#FFD93D'; ctx.fillRect(cx, cy, cw, H * 0.052); ctx.restore();
  txt('被 抓 住 了 ！', cx + cw / 2, cy + H * 0.026, H * 0.032, '#8A4A2A', 'center', '900');
  txt(G.cause, cx + cw / 2, cy + H * 0.075, H * 0.020, '#A8734A', 'center', '600');
  const rows = [['分数', Math.floor(G.score).toLocaleString('en-US')], ['里程', Math.floor(G.dist) + ' m'], ['最高分', Math.floor(Math.max(G.best, G.score)).toLocaleString('en-US')]];
  rows.forEach((r, i) => {
    const y = cy + H * (0.118 + i * 0.040);
    txt(r[0], cx + cw * 0.14, y, H * 0.022, '#8A6A52', 'left', '600');
    txt(r[1], cx + cw * 0.86, y, H * 0.026, i === 0 ? '#E8543F' : '#5A4030', 'right', '900');
  });
  if (Math.floor(G.score) >= G.best && G.score > 0) txt('新纪录！', cx + cw * 0.5, cy + H * 0.243, H * 0.022, '#E8A93B', 'center', 'bold');
  if (Math.sin(t * 5) > -0.3) {
    fRR(cx + cw * 0.18, cy + ch - H * 0.055, cw * 0.64, H * 0.042, H * 0.021, '#FFD93D');
    txt('再 跑 一 次', cx + cw * 0.5, cy + ch - H * 0.034, H * 0.022, '#7A4A20', 'center', '900');
  }
  ctx.restore();
}

/* ---- 渲染调度 ---- */
let PDT = 0.016;
function renderPlay(t) {
  const hy = H * CFG.HORIZON;
  const camBob = G.state === 'play' ? Math.sin(G.runPh * 2) * H * 0.0022 : 0;
  const camRot = G.state === 'play' ? clamp((G.lane - G.laneF) * 0.011, -0.014, 0.014) : 0;
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  const camScale = 1.014 + G.shake / 420;                             // 轻微放大，避免镜头运动露出边缘
  ctx.translate(W / 2, hy); ctx.rotate(camRot); ctx.scale(camScale, camScale); ctx.translate(-W / 2, -hy);
  ctx.translate(0, camBob);
  drawSky(t, G.scrollZ);
  drawRoad(G.scrollZ);
  drawSideProps(G.scrollZ);
  drawWarn(t, 'ground');                                              // 地面落点圈贴地，早画
  const list = G.objs.slice();
  if (G.state !== 'over') { const g = doubaoGeom(); list.push({ kind: 'doubao', lane: G.dLane, z: g.d, dead: 0 }); }
  list.sort((a, b) => b.z - a.z);                                     // 由远及近
  let drew = false;
  for (const o of list) {
    if (!drew && o.z < 0 && G.state !== 'over') { drawPlayer(t); drew = true; }
    if (o.kind === 'doubao') drawDoubaoScene(t);
    else drawEntity(o, t);
  }
  if (!drew && G.state !== 'over') drawPlayer(t);
  if (G.state === 'over') drawFallenScene(t);
  drawWarn(t, 'air');
  drawParticles(PDT); drawPops(PDT);
  ctx.restore();
  drawFx(t);
  if (G.state === 'play') drawHUD(t);
  else renderOver(t);
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (G.state === 'title') renderTitle(G.t);
  else if (G.state === 'intro') renderIntro(G.t);
  else renderPlay(G.t);
  if (G.state !== 'play') watermark();
}

/* ---- 逻辑调度 ---- */
function updateOver(dt) {
  G.deadT += dt;
  G.speed = lerp(G.speed, 0, clamp(dt * 3.5, 0, 1));
  G.scrollZ += G.speed * dt;
  for (let i = G.objs.length - 1; i >= 0; i--) { const o = G.objs[i]; o.z -= G.speed * dt; o.ph += dt * 4; if (o.z < CFG.Z_DEAD) G.objs.splice(i, 1); }
  G.dLane += (G.laneF - G.dLane) * clamp(dt * 3, 0, 1);
  G.dPh += dt * 6;
  if (G.glitch > 0) G.glitch -= dt;
}
function update(dt) {
  G.st += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 42);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.4);
  if (G.state === 'play') updatePlay(dt);
  else if (G.state === 'intro') { if (G.st > 2.15) { goto('play'); } }
  else if (G.state === 'over') updateOver(dt);
}
function handleTap() {
  if (G.state === 'title') { resetRun(); goto('intro'); Audio.start(); }
  else if (G.state === 'over' && G.deadT > 1.4) { resetRun(); goto('play'); Audio.start(); }
}
function consumeInput() {
  const q = IN.queue.slice(); IN.queue.length = 0;
  for (const a of q) handleAction(a);
  if (IN.tap) { IN.tap = false; handleTap(); }
}
let lastTs = 0;
function frame(ts) {
  const dt = Math.min(0.045, Math.max(0.001, (ts - lastTs) / 1000 || 0.016));
  lastTs = ts; PDT = dt; G.t += dt;
  consumeInput(); update(dt); render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
/* =========================== 全文完 · 作者：汤圆Vision =========================== */
</script>
