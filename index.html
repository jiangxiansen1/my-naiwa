<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>我的奶屎</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 20% 0%,#3b2a63 0%,#241740 45%,#150d28 100%);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#phone{width:min(420px,100vw);height:min(900px,100vh);height:min(900px,100dvh);background:#0c0c12;border-radius:38px;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px #333340;position:relative}
#screen{width:100%;height:100%;border-radius:30px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:22px;background:#0c0c12;border-radius:12px;z-index:40;pointer-events:none}
#topbar{display:flex;align-items:center;gap:8px;padding:34px 12px 8px;background:linear-gradient(#FFE9A8,#FFD86B);color:#6b4a12;font-weight:800;z-index:10}
#topbar .t{font-size:19px;letter-spacing:2px;text-shadow:0 1px 0 #fff8}
#topbar .sp{flex:1}
.pill{background:#fff;border:2px solid #c98a1b;border-radius:999px;padding:3px 10px;font-size:13px;color:#6b4a12;font-weight:800;cursor:pointer}
#stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px 10px;background:#FFF7DF;border-bottom:2px solid #f0d9a0;z-index:9}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px}
.stat .ic{font-size:14px;line-height:1}
.stat .bar{width:100%;height:8px;background:#e8d9b5;border-radius:6px;overflow:hidden}
.stat .fill{height:100%;border-radius:6px;transition:width .4s}
.f-hunger{background:linear-gradient(90deg,#ff9a3d,#ff6b35)}
.f-mood{background:linear-gradient(90deg,#ff7eb3,#ff4f8b)}
.f-clean{background:linear-gradient(90deg,#6fd6ff,#2fa8e0)}
.f-energy{background:linear-gradient(90deg,#ffe066,#f5b301)}
.f-bladder{background:linear-gradient(90deg,#b39ddb,#7e57c2)}
#scene{flex:1;position:relative;overflow:hidden}
.room{position:absolute;inset:0;display:none}
.room.on{display:block}
.wall{position:absolute;inset:0}
.floor{position:absolute;left:0;right:0;bottom:0;height:26%}
#room-living .wall{background:linear-gradient(#FFF3D6 0%,#FFE7B8 70%,#FFE0A6 100%)}
#room-living .floor{background:linear-gradient(#E0A960,#C88C46)}
.win{position:absolute;top:8%;left:8%;width:34%;height:26%;background:linear-gradient(#BEE7FF,#E8F8FF);border:6px solid #fff;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.win:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 47%,#fff 47%,#fff 53%,transparent 53%),linear-gradient(0deg,transparent 47%,#fff 47%,#fff 53%,transparent 53%)}
.bed{position:absolute;right:4%;bottom:24%;font-size:74px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15));cursor:pointer}
.sofa{position:absolute;left:3%;bottom:23%;font-size:60px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15))}
#room-rest .wall{background:linear-gradient(#FFE9E0 0%,#FFD9C8 100%)}
#room-rest .floor{background:linear-gradient(#D89A6A,#BF7F4E)}
.table{position:absolute;left:8%;right:8%;bottom:20%;height:16%;background:linear-gradient(#B4713A,#96562A);border-radius:14px;box-shadow:0 8px 14px rgba(0,0,0,.2)}
.table:before{content:"";position:absolute;left:8%;right:8%;top:-8px;height:10px;background:#8a4d24;border-radius:8px}
.lamp{position:absolute;top:4%;left:50%;transform:translateX(-50%);font-size:44px}
#menu{position:absolute;left:6%;right:6%;bottom:2%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:6}
.food{background:#fff;border:2px solid #c98a1b;border-radius:12px;padding:6px 2px;text-align:center;cursor:pointer;font-size:11px;color:#6b4a12;font-weight:700;line-height:1.25}
.food .e{font-size:24px;display:block}
.food:active{transform:scale(.93)}
#room-bath .wall{background:repeating-linear-gradient(0deg,#EAF7FF 0 34px,#D6EEFB 34px 36px),repeating-linear-gradient(90deg,transparent 0 34px,#cfe9f8 34px 36px);background-color:#EAF7FF}
#room-bath .floor{background:linear-gradient(#9FD4EA,#7FB8D4)}
.tub{position:absolute;left:6%;right:6%;bottom:4%;height:30%;background:linear-gradient(#ffffff,#dfe9f2);border-radius:18px 18px 40px 40px;box-shadow:inset 0 -14px 0 #cfe0ee,0 8px 14px rgba(0,0,0,.12);z-index:6}
.tub:before{content:"";position:absolute;left:6%;right:6%;top:10px;height:26%;background:linear-gradient(#8ED8F8,#5CB8E6);border-radius:12px}
.shower{position:absolute;top:6%;right:10%;font-size:40px}
#room-wc .wall{background:repeating-linear-gradient(0deg,#F2F2F5 0 34px,#E4E4EA 34px 36px);background-color:#F2F2F5}
#room-wc .floor{background:linear-gradient(#B9B9C6,#9C9CAC)}
.toilet{position:absolute;left:32%;transform:translateX(-50%);bottom:6%;font-size:110px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18));z-index:4}
.paper{position:absolute;top:10%;left:10%;font-size:40px}
#frogWrap{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:60%;z-index:5;cursor:pointer;transition:bottom .3s}
#frogWrap svg{display:block;width:100%;height:auto;overflow:visible}
.breathe{animation:breathe 2.6s ease-in-out infinite}
#frogWrap svg{transform-origin:50% 90%}
.wobble{animation:wobble 3.6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-1.4deg) scale(1,.995)}50%{transform:rotate(1.4deg) scale(.995,1.005)}}
@keyframes breathe{0%,100%{transform:translateX(-50%) scale(1,1)}50%{transform:translateX(-50%) scale(1.02,.985)}}
.shakeHard{animation:shakeHard .28s linear 8}
@keyframes shakeHard{0%{transform:translateX(-50%) rotate(-7deg)}50%{transform:translateX(-46%) rotate(6deg) translateY(-6px)}100%{transform:translateX(-50%) rotate(-7deg)}}
.bouncy{animation:bouncy .5s ease-in-out 5}
@keyframes bouncy{0%,100%{transform:translateX(-50%) translateY(0) scale(1,1)}40%{transform:translateX(-50%) translateY(-26px) scale(.96,1.06)}70%{transform:translateX(-50%) translateY(0) scale(1.06,.94)}}
.squash{animation:squash .45s ease-in-out 4}
@keyframes squash{0%,100%{transform:translateX(-50%) scale(1,1)}30%{transform:translateX(-50%) scale(1.18,.8)}60%{transform:translateX(-50%) scale(.92,1.1)}}
.glance{animation:glance 2.4s ease-in-out 1}
@keyframes glance{0%{transform:translateX(-50%) scaleX(1)}18%{transform:translateX(-50%) scaleX(-1) rotate(-4deg)}30%{transform:translateX(-58%) scaleX(-1) scale(1.12)}70%{transform:translateX(-58%) scaleX(-1) scale(1.12)}100%{transform:translateX(-50%) scaleX(1)}}
.crawl{animation:crawl 3s linear 1}
@keyframes crawl{0%{transform:translateX(-130%) }100%{transform:translateX(-8%)}}
.dropIn{animation:dropIn .5s cubic-bezier(.34,1.56,.64,1) 1}
@keyframes dropIn{0%{transform:translateX(-50%) translateY(-160px) scale(.8)}100%{transform:translateX(-50%) translateY(0) scale(1)}}
.zoomPulse{animation:zoomPulse .6s ease-in-out 4}
@keyframes zoomPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}}
.screenShake{animation:screenShake .3s linear 6}
@keyframes screenShake{0%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}50%{transform:translate(4px,-4px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(0,0)}}
#bubble{position:absolute;top:9%;left:50%;transform:translateX(-50%) scale(.6);background:#fff;border:3px solid #6b4a12;border-radius:18px;padding:9px 16px;font-size:15px;font-weight:800;color:#5c3d0e;max-width:74%;text-align:center;opacity:0;transition:all .22s cubic-bezier(.34,1.56,.64,1);z-index:12;pointer-events:none}
#bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
#bubble:after{content:"";position:absolute;bottom:-12px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#6b4a12;border-bottom:0}
#fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.prop{position:absolute;font-size:34px;will-change:transform}
.p-fall{animation:pfall 1.1s ease-in forwards}
@keyframes pfall{0%{transform:translateY(-80px) rotate(0)}80%{transform:translateY(var(--dy,260px)) rotate(200deg)}100%{transform:translateY(var(--dy,260px)) rotate(220deg);opacity:0}}
.p-float{animation:pfloat 1.6s ease-out forwards}
@keyframes pfloat{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-130px) scale(1.25);opacity:0}}
.p-rain{animation:prain 1.4s linear forwards}
@keyframes prain{0%{transform:translateY(-60px) rotate(0);opacity:1}90%{opacity:1}100%{transform:translateY(var(--dy,300px)) rotate(540deg);opacity:0}}
.p-stay{animation:pstay 2.6s linear forwards}
@keyframes pstay{0%{opacity:1;transform:scale(.3) rotate(-20deg)}12%{transform:scale(1.2) rotate(6deg)}20%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
#sleepVeil{position:absolute;inset:0;background:rgba(12,10,40,.62);display:none;z-index:14;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-weight:800;font-size:17px;letter-spacing:2px}
#sleepVeil.on{display:flex}
#actionbar{display:flex;gap:7px;padding:8px 10px;background:#FFF7DF;border-top:2px solid #f0d9a0;flex-wrap:wrap;z-index:10}
.abtn{flex:1;min-width:70px;background:linear-gradient(#FFE08A,#F7B733);border:2px solid #c98a1b;border-radius:14px;padding:9px 2px;font-weight:800;color:#5c3d0e;font-size:14px;cursor:pointer;font-family:inherit}
.abtn:active{transform:scale(.94)}
.abtn.big{background:linear-gradient(#9BE59B,#4CAF50);border-color:#2e7d32;color:#fff}
#navbar{display:flex;gap:6px;background:#6b4a12;padding:8px 8px calc(10px + env(safe-area-inset-bottom));z-index:10}
.nbtn{flex:1;border:0;background:transparent;color:#ffe9a8;border-radius:12px;padding:9px 0;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.nbtn.on{background:#FFD86B;color:#6b4a12}
.overlay{position:absolute;inset:0;background:rgba(18,10,38,.82);display:none;z-index:30;flex-direction:column;align-items:center;backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.ovTitle{color:#FFD86B;font-size:22px;font-weight:900;letter-spacing:3px;margin:40px 0 10px}
.ovSub{color:#fff9;font-size:12px;margin-bottom:10px}
#albumGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 18px;overflow-y:auto;width:100%;max-height:62%}
.card{background:#fff;border-radius:14px;padding:10px 4px;text-align:center;font-weight:800;color:#5c3d0e;font-size:12px;border:3px solid #c98a1b;line-height:1.4}
.card .ce{font-size:34px;display:block;margin-bottom:4px}
.card.lock{background:#3a3350;border-color:#57506e;color:#8d86a8}
.card .cq{font-size:34px;display:block;margin-bottom:4px;filter:grayscale(1)}
.ovBtn{margin:14px auto 30px;background:linear-gradient(#FFE08A,#F7B733);border:2px solid #c98a1b;border-radius:999px;padding:10px 34px;font-weight:900;color:#5c3d0e;font-size:15px;cursor:pointer;font-family:inherit}
#runCanvas{width:100%;height:100%;display:block}
#runHud{position:absolute;top:38px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;color:#fff;font-weight:900;font-size:15px;text-shadow:0 2px 4px #0008;z-index:2;pointer-events:none}
#runTouch{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:2}
.rbtn{width:62px;height:52px;border-radius:14px;border:2px solid #fff8;background:#ffffff2e;color:#fff;font-size:20px;font-weight:900;backdrop-filter:blur(2px);cursor:pointer;font-family:inherit}
#runMsg{position:absolute;top:40%;left:0;right:0;text-align:center;color:#FFD86B;font-size:26px;font-weight:900;text-shadow:0 3px 6px #000a;z-index:2;pointer-events:none}
#runPanel{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:#fff;border-radius:20px;padding:22px 30px;text-align:center;color:#5c3d0e;font-weight:800;z-index:3;display:none;border:3px solid #c98a1b}
#runPanel.on{display:block}
#toast{position:absolute;bottom:118px;left:50%;transform:translateX(-50%) scale(.8);background:#000000c8;color:#FFD86B;font-weight:800;font-size:13px;border-radius:999px;padding:7px 16px;opacity:0;transition:all .25s;z-index:25;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#authorTag{position:fixed;right:10px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;color:#FFD86B;font-weight:900;letter-spacing:6px;font-size:15px;text-shadow:0 2px 8px #000a;z-index:60;pointer-events:none}
#helpBox{color:#fff;font-size:13.5px;line-height:2;padding:0 34px;font-weight:600}
#helpBox b{color:#FFD86B}
@media (max-width:480px){
body{background:#150d28}
#phone{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
#screen{border-radius:0}
#notch{display:none}
#topbar{padding-top:12px}
#authorTag{right:3px;font-size:10px;letter-spacing:3px;opacity:.85}
}
</style>
</head><body>
<div id="phone">
 <div id="screen">
  <div id="notch"></div>
  <div id="topbar">
    <span class="t">我的奶屎</span>
    <span class="sp"></span>
    <span class="pill" id="coinPill">🥜 0</span>
    <span class="pill" id="albumBtn">📖 图鉴</span>
    <span class="pill" id="muteBtn">🔊</span>
  </div>
  <div id="stats">
    <div class="stat"><span class="ic">🍗</span><div class="bar"><div class="fill f-hunger" id="b-hunger"></div></div></div>
    <div class="stat"><span class="ic">😄</span><div class="bar"><div class="fill f-mood" id="b-mood"></div></div></div>
    <div class="stat"><span class="ic">🫧</span><div class="bar"><div class="fill f-clean" id="b-clean"></div></div></div>
    <div class="stat"><span class="ic">⚡</span><div class="bar"><div class="fill f-energy" id="b-energy"></div></div></div>
    <div class="stat"><span class="ic">🚽</span><div class="bar"><div class="fill f-bladder" id="b-bladder"></div></div></div>
  </div>
  <div id="scene">
    <div class="room on" id="room-living">
      <div class="wall"></div><div class="win"></div><div class="floor"></div>
      <div class="sofa">🛋️</div><div class="bed" id="bedBtn">🛏️</div>
    </div>
    <div class="room" id="room-rest">
      <div class="wall"></div><div class="floor"></div><div class="lamp">💡</div><div class="table"></div>
      <div id="menu">
        <div class="food" data-food="peanut"><span class="e">🥜</span>花生<br>免费</div>
        <div class="food" data-food="burger"><span class="e">🍔</span>苍蝇汉堡<br>🥜5</div>
        <div class="food" data-food="tea"><span class="e">🧋</span>奶屎奶茶<br>🥜8</div>
        <div class="food" data-food="water"><span class="e">🥤</span>洗脚水特饮<br>🥜1</div>
      </div>
    </div>
    <div class="room" id="room-bath">
      <div class="wall"></div><div class="floor"></div><div class="shower">🚿</div><div class="tub"></div>
    </div>
    <div class="room" id="room-wc">
      <div class="wall"></div><div class="floor"></div><div class="paper">🧻</div><div class="toilet">🚽</div>
    </div>
    <div id="frogWrap" class="breathe"></div>
    <div id="fx"></div>
    <div id="bubble"></div>
    <div id="sleepVeil"><div style="font-size:52px">💤</div><div>奶屎睡着了…</div><div style="font-size:12px;color:#fff8;margin-top:6px">点「起床」叫醒它</div></div>
  </div>
  <div id="actionbar"></div>
  <div id="navbar">
    <button class="nbtn on" data-room="living">🏠 客厅</button>
    <button class="nbtn" data-room="rest">🍽️ 餐厅</button>
    <button class="nbtn" data-room="bath">🛁 浴室</button>
    <button class="nbtn" data-room="wc">🚽 厕所</button>
  </div>
  <div id="toast"></div>
  <div class="overlay" id="albumOv">
    <div class="ovTitle"> 奶屎梗图鉴</div>
    <div class="ovSub" id="albumSub">已收集 0 / 11</div>
    <div id="albumGrid"></div>
    <button class="ovBtn" id="albumClose">合上图鉴</button>
  </div>
  <div class="overlay" id="helpOv">
    <div class="ovTitle">🐸 我的奶屎</div>
    <div id="helpBox">
      <b>点点奶屎</b>：随机触发网络热梗小剧场<br>
      <b>客厅</b>：摸摸、睡觉、去跑酷<br>
      <b>餐厅</b>：喂花生、汉堡、奶茶、洗脚水<br>
      <b>浴室</b>：搓澡冲淋，洗得白白嫩嫩<br>
      <b>厕所</b>：坐下解决问题，一键冲水<br>
      <b>跑酷</b>：左右躲、跳、滑，吃花生赚🥜<br>
      电脑用方向键 / 手机滑动屏幕操作
    </div>
    <button class="ovBtn" id="helpClose">开始养蛙！</button>
  </div>
  <div class="overlay" id="runOv">
    <canvas id="runCanvas"></canvas>
    <div id="runHud"><span id="runDist">距离 0 米</span><span id="runNut">🥜 0</span><span id="runLife">❤️❤️❤️</span></div>
    <div id="runMsg"></div>
    <div id="runTouch">
      <button class="rbtn" data-k="left">◀</button>
      <button class="rbtn" data-k="up">▲</button>
      <button class="rbtn" data-k="down">▼</button>
      <button class="rbtn" data-k="right">▶</button>
    </div>
    <div id="runPanel">
      <div style="font-size:20px;margin-bottom:8px">本局结束！</div>
      <div id="runResult" style="font-size:14px;line-height:1.9"></div>
      <button class="ovBtn" id="runAgain" style="margin:14px 6px 4px">再来一局</button>
      <button class="ovBtn" id="runExit" style="margin:14px 6px 4px;background:linear-gradient(#ddd,#bbb);border-color:#888">回客厅</button>
    </div>
  </div>
 </div>
</div>

 if(k==="ArrowLeft"||k==="a"||k==="A")move(-1);else if(k==="ArrowRight"||k==="d"||k==="D")move(1);
 else if(k==="ArrowUp"||k==="w"||k==="W"||k===" ")jump();else if(k==="ArrowDown"||k==="s"||k==="S")slide();});
$$("#runTouch .rbtn").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="left")move(-1);if(k==="right")move(1);if(k==="up")jump();if(k==="down")slide();});
let ts0=null;cv.addEventListener("touchstart",e=>{ts0=e.touches[0];},{passive:true});
cv.addEventListener("touchend",e=>{if(!ts0)return;const t=e.changedTouches[0],dx=t.clientX-ts0.clientX,dy=t.clientY-ts0.clientY;
 if(Math.abs(dx)>Math.abs(dy)){if(Math.abs(dx)>24)move(dx>0?1:-1);}else{if(dy<-24)jump();else if(dy>24)slide();}ts0=null;},{passive:true});
$("#runAgain").onclick=()=>openRun();
$("#runExit").onclick=()=>{R.on=false;$("#runOv").classList.remove("on");AU.click();restPose();};
function spawnObj(){const r=Math.random();let type=r<.26?"block":r<.48?"jump":r<.66?"slide":r<.9?"nut":"coin";
 R.objs.push({z:0,lane:ri(-1,1),type,done:false});}
function drawRunner(x,y,s,ph,sl){cx2.save();cx2.translate(x,y);cx2.scale(s,s);if(sl)cx2.scale(1.2,.65);
 cx2.rotate(Math.sin(ph)*.06);
 const g=cx2.createLinearGradient(0,-60,0,60);g.addColorStop(0,"#FFEB7A");g.addColorStop(.45,"#FBD243");g.addColorStop(1,"#EFAF25");
 cx2.fillStyle=g;
 cx2.beginPath();cx2.ellipse(0,38,34,15,0,0,7);cx2.fill();
 cx2.beginPath();cx2.ellipse(0,18,29,14,0,0,7);cx2.fill();
 cx2.beginPath();cx2.ellipse(0,0,24,13,0,0,7);cx2.fill();
 cx2.beginPath();cx2.ellipse(0,-18,18,15,0,0,7);cx2.fill();
 cx2.beginPath();cx2.moveTo(-2,-30);cx2.quadraticCurveTo(-10,-46,-16,-48);cx2.quadraticCurveTo(-6,-52,2,-40);cx2.quadraticCurveTo(5,-33,2,-30);cx2.closePath();cx2.fill();
 cx2.strokeStyle="#C98A1B";cx2.lineWidth=2;cx2.globalAlpha=.5;
 cx2.beginPath();cx2.ellipse(0,30,30,6,0,0,Math.PI);cx2.stroke();
 cx2.beginPath();cx2.ellipse(0,11,25,5,0,0,Math.PI);cx2.stroke();
 cx2.globalAlpha=1;
 cx2.fillStyle="#7FBF3F";cx2.beginPath();cx2.arc(-8,-20,6,0,7);cx2.fill();cx2.beginPath();cx2.arc(8,-20,6,0,7);cx2.fill();
 cx2.fillStyle="#101010";cx2.beginPath();cx2.arc(-8,-20,3.2,0,7);cx2.fill();cx2.beginPath();cx2.arc(8,-20,3.2,0,7);cx2.fill();
 cx2.strokeStyle="#6B5B3A";cx2.lineWidth=2;cx2.beginPath();cx2.arc(0,-12,6,.2,Math.PI-.2);cx2.stroke();
 cx2.restore();}
function runUpdate(dt){if(R.st!=="play")return;R.t+=dt;R.speed=Math.min(1.25,R.speed+dt*.012);R.dist+=R.speed*dt*16;R.spawn-=dt;
 if(R.spawn<=0){spawnObj();R.spawn=Math.max(.5,1.15-R.speed*.45);}
 R.laneT+=(R.lane-R.laneT)*Math.min(1,dt*12);
 if(R.jy>0||R.vy>0){R.jy+=R.vy*dt;R.vy-=1600*dt;if(R.jy<=0){R.jy=0;R.vy=0;}}
 if(R.slideT>0)R.slideT-=dt;if(R.inv>0)R.inv-=dt;
 R.objs.forEach(o=>{o.z+=R.speed*dt*.85;});
 R.objs.forEach(o=>{if(o.done)return;
  if(o.z>.88&&o.z<1.02&&Math.abs(o.lane-R.laneT)<.55){
   if(o.type==="nut"){o.done=true;R.nuts++;AU.pop();return;}
   if(o.type==="coin"){o.done=true;R.nuts+=3;AU.coin();return;}
   if(R.inv>0)return;
   let hit=true;
   if(o.type==="jump"&&R.jy>42)hit=false;
   if(o.type==="slide"&&R.slideT>0)hit=false;
   if(hit){o.done=true;R.lives--;R.inv=1.3;AU.crash();$("#runMsg").textContent="哎哟！";setTimeout(()=>{if(R.st==="play")$("#runMsg").textContent="";},600);
    if(R.lives<=0)endRun();}}});
 R.objs=R.objs.filter(o=>o.z<1.15);}
function runDraw(){const w=cv.clientWidth,h=cv.clientHeight,hor=h*.3;
 cx2.clearRect(0,0,w,h);
 const sky=cx2.createLinearGradient(0,0,0,hor);sky.addColorStop(0,"#8ED8F8");sky.addColorStop(1,"#FFE9A8");cx2.fillStyle=sky;cx2.fillRect(0,0,w,hor+2);
 cx2.fillStyle="#c9b8a8";for(let i=-1;i<6;i++){const bx=i*80-R.bg;const bh=70+((i%3+3)%3)*18;cx2.fillRect(bx,hor-bh,52,bh);}
 cx2.fillStyle="#8a7a6a";for(let i=-1;i<6;i++){const bx=i*80-R.bg+10;const bh=70+((i%3+3)%3)*18;for(let j=0;j<3;j++)cx2.fillRect(bx+8,hor-bh+12+j*16,10,8);}
 cx2.fillStyle="#5a5a66";cx2.beginPath();cx2.moveTo(w*.5-6,hor);cx2.lineTo(w*.5+6,hor);cx2.lineTo(w*1.02,h);cx2.lineTo(-w*.02,h);cx2.fill();
 cx2.strokeStyle="#ffffff88";cx2.lineWidth=3;for(let l=-1;l<=1;l+=2){cx2.beginPath();for(let z=0;z<=1.001;z+=.1){const y=hor+(h-hor)*z*z,x=w/2+l*w*.30*z*z;cx2.lineTo(x,y);}cx2.stroke();}
 const zp=z=>z*z, yOf=z=>hor+(h-150-hor)*zp(z), half=z=>w*.46*zp(z);
 R.objs.slice().sort((a,b)=>a.z-b.z).forEach(o=>{const z=Math.max(.04,o.z),s=.16+.9*zp(z),x=w/2+o.lane*half(z)*.66,y=yOf(z);
  cx2.textAlign="center";cx2.textBaseline="bottom";
  if(o.type==="block"){cx2.font=(64*s)+"px serif";cx2.fillText("🗑️",x,y);}
  else if(o.type==="jump"){cx2.font=(52*s)+"px serif";cx2.fillText("🚧",x,y);}
  else if(o.type==="slide"){cx2.font=(56*s)+"px serif";cx2.fillText("🪧",x,y-95*s);}
  else if(o.type==="nut"){cx2.font=(44*s)+"px serif";cx2.fillText("🥜",x,y-30*s-Math.sin(R.t*6+o.z*9)*6);}
  else{cx2.font=(44*s)+"px serif";cx2.fillText("🪙",x,y-30*s-Math.sin(R.t*6+o.z*9)*6);}});
 if(R.st!=="over"){const px=w/2+R.laneT*half(1)*.66, py=h-150-R.jy*.55;
  if(!(R.inv>0&&Math.floor(R.t*12)%2===0))drawRunner(px,py,1.05,R.t*14,R.slideT>0);}
 $("#runDist").textContent="距离 "+Math.floor(R.dist)+" 米";$("#runNut").textContent="🥜 "+R.nuts;$("#runLife").textContent="❤️".repeat(Math.max(0,R.lives))||"💀";}
let lastT=0;function runLoop(ts2){requestAnimationFrame(runLoop);if(!R.on)return;const dt=Math.min(.05,(ts2-lastT)/1000||0);lastT=ts2;runUpdate(dt);runDraw();}
requestAnimationFrame(runLoop);
window.addEventListener("resize",()=>{if(R.on)sizeCv();});
/* ================= 主循环 ================= */
let tickN=0;
setInterval(()=>{const s=G.s;
 if(G.sleeping){s.energy=clamp(s.energy+2,0,100);s.hunger=clamp(s.hunger-.02,0,100);s.bladder=clamp(s.bladder+.02,0,100);
  if(s.energy>=100)wake();}
 else{s.hunger=clamp(s.hunger-.055,0,100);s.clean=clamp(s.clean-.028,0,100);s.energy=clamp(s.energy-.04,0,100);s.bladder=clamp(s.bladder+.05,0,100);
  const avg=(s.hunger+s.clean+s.energy+(100-s.bladder))/4;s.mood=clamp(s.mood+(avg-s.mood)*.03,0,100);}
 updStats();tickN++;
 if(tickN%10===0)save();
 if(!G.busy&&!G.sleeping){
  if(G.room!=="bath"&&G.room!=="wc"){if(s.clean<35&&G.pose==="idle")setPose("dirty");else if(s.clean>=35&&G.pose==="dirty")setPose("idle");}
  if(tickN%16===0){
   if(s.bladder>78){bubble(pick(WC_LINES),2000);anim("bouncy",1200);}
   else if(s.hunger<30){bubble(pick(HUNGRY_LINES),2000);}
   else if(s.clean<35){bubble(pick(DIRTY_LINES),2000);prop("🪰","p-float",ri(30,60),ri(30,50));}
   else if(s.energy<30){bubble(pick(TIRED_LINES),2000);}
  }}},1000);
/* ================= 启动 ================= */
AU.muted=G.muted;$("#muteBtn").textContent=AU.muted?"🔇":"🔊";
updStats();setPose("idle");renderActions();
if(!localStorage.getItem("naiwaHelpSeen")&&!location.search.includes("nohelp")){$("#helpOv").classList.add("on");localStorage.setItem("naiwaHelpSeen","1");}
$("#helpClose").onclick=()=>{AU.resume();AU.click();$("#helpOv").classList.remove("on");bubble("噗噗！我是奶屎，点点我试试！",2600);};
setTimeout(()=>{if(!$("#helpOv").classList.contains("on"))bubble("噗噗！点点我有惊喜～",2600);},800);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});

if(qp.get("room"))goRoom(qp.get("room"));
if(qp.get("demo"))setTimeout(()=>{const m=MEMES.find(x=>x.id===qp.get("demo"));if(m)playMeme(m);},400);
if(qp.has("run"))setTimeout(openRun,400);
if(qp.has("sim"))setTimeout(()=>{openRun();R.st="play";$("#runMsg").textContent="";const n=parseInt(qp.get("sim"))||300;for(let i=0;i<n;i++)runUpdate(1/60);runDraw();},300);
